# Domain Zero – Agent ↔ Skills Mapping (v2)
# Purpose: Provide a single place to record which Claude Skills (example or custom)
# are recommended per agent. Keep organization-specific skills in a private repo.

version: 2
updated: 2025-12-02

canonical_reference:
  overview: https://claude.com/blog/skills
  repository: https://github.com/anthropics/skills/tree/main

agents:
  yuuji:
    example_skills:
      - webapp-testing          # Playwright-based UI testing patterns
      - mcp-server              # Guidance for creating MCP integrations
      - artifacts-builder       # Structured artifact scaffolds (when helpful)
    document_skills:
      - docx
      - pptx
      - xlsx
      - pdf
    custom_skills:
      - codegen-standards
      - tdd-checklist
      - async-patterns
      - testing-fixtures

  megumi:
    example_skills:
      - webapp-testing          # For e2e verification hooks during audits
    document_skills: []
    custom_skills:
      - owasp-checklist
      - threat-modeling
      - jwt-audit
      - secrets-review
      - dependency-audit

  nobara:
    example_skills:
      - brand-guidelines
      - theme-factory
      - canvas-design
      - slack-gif-creator
    document_skills:
      - pptx
      - pdf
    custom_skills:
      - ux-writing
      - a11y-review
      - onboarding-flows
      - design-system-glossary

  gojo:
    example_skills:
      - skill-creator
      - template-skill
      - mcp-server
      - internal-comms
    document_skills: []
    custom_skills:
      - skill-builder         # Create new skills rapidly with proper structure
      - protocol-verify
      - release-briefing
      - version-audit
      - work-session-monitoring

  todo:
    example_skills:
      - mcp-server            # Database integrations via MCP
    document_skills: []
    custom_skills:
      - schema-design         # Database schema design patterns
      - migration-planner     # Data migration planning and execution
      - query-optimization    # SQL/NoSQL query optimization
      - orm-configuration     # ORM setup and relationship mapping
      - data-normalization    # Database normalization strategies

  maki:
    example_skills:
      - webapp-testing        # For performance testing hooks
    document_skills: []
    custom_skills:
      - lighthouse-audit      # Web performance auditing
      - bundle-analysis       # JavaScript bundle optimization
      - profiling-tools       # Chrome DevTools and profiler usage
      - memory-optimization   # Memory leak detection and resolution
      - critical-path         # Critical rendering path optimization

  panda:
    example_skills:
      - mcp-server            # CI/CD tool integrations
    document_skills: []
    custom_skills:
      - github-actions        # GitHub Actions workflow configuration
      - vite-config           # Vite build tool configuration
      - docker-builds         # Docker containerization for builds
      - build-caching         # Build cache optimization strategies
      - test-pipelines        # Test automation pipeline setup

  inumaki:
    example_skills:
      - mcp-server            # API gateway integrations
    document_skills: []
    custom_skills:
      - openapi-design        # OpenAPI 3.0 specification design
      - graphql-schema        # GraphQL schema and resolver design
      - rest-patterns         # RESTful API design patterns
      - api-validation        # Request/response validation schemas
      - websocket-design      # Real-time communication design

policy:
  execution_risk:
    code_skills_require_review: true
    sast_sca_required: true
  versioning:
    pin_versions: true
    registry_file: SKILL_REGISTRY.md
  governance:
    owners:
      - gojo
      - megumi
    review_interval_days: 90
