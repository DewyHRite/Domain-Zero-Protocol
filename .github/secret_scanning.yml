# GitHub Secret Scanning configuration (SEC-CORTEX-ENC-015 closure, v9.9.3).
#
# Owner: protocol owner (DewyHRite)
# Review-by: 2026-10-09
#
# Reviewed, COMPENSATED exception (SEC-001, Toji audit, v9.9.4): this path-ignore
# silences GitHub scanning for the ENTIRE named file, not just the one historical
# literal below — so it could otherwise mask a FUTURE real secret appended to that
# file. That gap is compensated by an always-on companion scanner,
# scripts/scan_protected_records.py, wired into the unified pre-commit hook
# (scripts/git-hooks/pre-commit[.ps1]) and CI (.github/workflows/validate-protocol.yml).
# It scans dev-notes.md (and its sibling security-review.md) on every commit/push and
# fails closed on any secret-shaped match except this one allowlisted literal. Do NOT
# remove this path-ignore without also handling the un-scrubbable historical literal
# (it cannot be edited without violating FEAT-GUARD-001 append-only integrity) — the
# companion scanner is the intended long-term compensating control, not a replacement
# for revisiting this file at the Review-by date above.
#
# Why this file exists:
#   `.protocol-state/dev-notes.md` is a FEAT-GUARD-001 append-only protected
#   project document (Yuuji's implementation log). Its v9.9.2 entry
#   ("### TEST-001 (housekeeping, secret-scanner noise)") records, as
#   historical fact, that a Stripe PUBLIC-DOCUMENTATION example secret key
#   (`sk_live_4eC39...7dc`, truncated here defensively so this config file's own
#   source bytes never contain the contiguous token -- Stripe's own long-published
#   sample key, never a real/live credential) was replaced with a synthetic token in
#   the test files that used to contain it. The literal example key string
#   itself remains quoted in that historical entry for audit-trail accuracy.
#
#   Because dev-notes.md is append-only (NEVER overwritten or rewritten — see
#   CLAUDE.md "PROJECT DOCUMENTS PROTECTION" + the pre-commit byte-prefix
#   guard in scripts/check_protected_append_only.py), this historical mention
#   CANNOT be scrubbed, redacted, or reworded without violating append-only
#   integrity and would require DZP_ALLOW_PROTECTED_REWRITE, which is reserved
#   for authorized rotation/restore operations, not routine scanner noise.
#
#   Every push therefore re-flags this single, already-triaged, known-invalid
#   "secret" on the same historical line. This config scopes GitHub secret
#   scanning off that one append-only path at the config level (no doc
#   rewrite, no weakening of scanning anywhere else in the repo) so the
#   finding stops re-alerting. The corresponding push-protection alert should
#   also be dismissed as "used in tests" / "false positive" by a repo admin.
#
# Scope: this ignores ONLY the named historical path. All other files
# (including the live source/test files that formerly held the literal —
# now replaced with a runtime-synthesized token, see TEST-001-RESIDUAL,
# v9.9.3) remain fully scanned.
#
# Reference: https://docs.github.com/en/code-security/secret-scanning/secret-scanning-patterns#defining-secret-scanning-patterns-for-a-repository

paths-ignore:
  - ".protocol-state/dev-notes.md"
