name: Domain Zero Protocol Validation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate State Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run protocol validation
        run: |
          python scripts/validate-protocol.py --check --verbose

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: .protocol-state/validation/validation-report.md
          retention-days: 30

      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Protocol validation failed. Please check the validation report artifact for details.';

            try {
              if (fs.existsSync('.protocol-state/validation/validation-report.md')) {
                report = fs.readFileSync('.protocol-state/validation/validation-report.md', 'utf8');
              }
            } catch (err) {
              console.log('Could not read validation report:', err);
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Protocol Validation Failed\n\n${report}`
            });
