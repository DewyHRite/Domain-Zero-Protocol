# CodeRabbit configuration — Domain Zero Protocol
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# Purpose: formalize CodeRabbit as a MANDATORY review gate on every PR,
# especially the DZP-vX.Y.Z distribution-release PRs (see
# docs/guides/DISTRO_RELEASE_WORKFLOW.md).
language: en-US

reviews:
  # "Request changes" so an unaddressed review surfaces as a blocking state.
  # Combine with a branch-protection rule on DZP-v* to hard-block merge.
  request_changes_workflow: true
  # Path filters (USER-authorized 2026-07-19): exclude static/no-logic content
  # so release PRs stay under the reviewer's file limit. Every version cascade
  # bumps a stamp line in these files, inflating release-PR file counts past
  # the plan cap (v9.10.1 PR #113: 105 files, 83 pure stamp churn, review
  # auto-skipped). Excluded classes carry NO executable logic: JJK character
  # lore, output templates, slash-command registry stubs, and protocol module
  # docs whose only per-release delta is the stamp header. All engine code,
  # guards, wrappers, skills, agent files, and user docs remain in scope.
  # NOTE: CodeRabbit reads this file from the PR BASE branch ("Repository
  # YAML (base)") — release PRs must therefore use a base that carries these
  # filters (helper branch DZP-vX.Y.Z-crbase pattern; the frozen DZP-vX.Y.Z
  # artifact itself is never modified).
  path_filters:
    - "!**/.protocol-state/jjk-character-reference/**"
    - "!**/.protocol-state/gojo-templates/**"
    - "!**/.protocol-state/sukuna-templates/**"
    - "!**/protocol/modules/**"
    - "!**/protocol/gojo-procedures/**"
    - "!**/.claude/commands/**"
    - "!**/slash-commands/**"
    - "!.claude/commands/**"
    - "!slash-commands/**"
    - "!protocol/modules/**"
    - "!protocol/gojo-procedures/**"
    - "!.protocol-state/jjk-character-reference/**"
    - "!.protocol-state/gojo-templates/**"
    - "!.protocol-state/sukuna-templates/**"
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # Review the release branches (and the dev integration branches) explicitly.
    base_branches:
      - "DZP-v.*"
      - "Main-v.*"
  path_instructions:
    - path: "distro/**"
      instructions: >
        This is the SANITIZED, published distribution tree (DZP-vX.Y.Z). It must
        contain NO personal data (owner name/email/usernames), NO dev-only paths
        (internal-docs/, tests/, .dzp-domain/, registry, PATCH reports), and NO
        secrets. Flag any identity leakage, dev-only artifact, or version-stamp
        drift. The tree is generated from canonical via scripts/distro/publish-manifest.yaml.
    - path: ".protocol-state/migrate_cortex_storage_9_4.py"
      instructions: >
        Data-mutating migration. Verify backup-first ordering, single BEGIN IMMEDIATE
        atomicity, the parity gate runs before any DROP, and rollback fails closed.

chat:
  auto_reply: true
