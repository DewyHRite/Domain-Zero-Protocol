# Domain Zero Protocol Configuration
# Version: 9.12.1
# This file serves as the canonical source of truth for all protocol parameters
# Modify this file to customize Domain Zero for your project

# ============================================================================
# CANONICAL REPOSITORY (Source of Truth)
# ============================================================================
canonical_repository:
  url: "https://github.com/DewyHRite/Domain-Zero-Protocol"
  version: "v9.12.1"
  release_branch: "DZP-v9.12.1"
  commit: "<PINNED_SHA>"  # OPTIONAL: Replace with specific commit SHA for strict version pinning
                           # Leave as placeholder if tracking version tag instead
  auto_update:
    enabled: false          # Set true if downstream wants automatic pulls
    strategy: "tag"         # tag | commit | latest
    check_on_verify: true   # Verification script warns on mismatch
  # Every downstream install POINTS BACK HERE to check for updates and report issues.
  update_check:
    command: "scripts/check-updates.(ps1|sh)"  # compares local protocol_version vs canonical latest
    source: "default branch VERSION.md via HEAD (raw.githubusercontent.com/.../HEAD/VERSION.md)"
  report_back:
    issues: "https://github.com/DewyHRite/Domain-Zero-Protocol/issues"
    security_advisories: "https://github.com/DewyHRite/Domain-Zero-Protocol/security/advisories"

# ============================================================================
# SAFETY & WELLBEING (ABSOLUTE PRIORITY)
# ============================================================================
# User safety and wellbeing override ALL other protocol objectives.
# No agent, not even Gojo, may compromise user safety under any circumstances.

safety:
  # User safety principles - these override all other protocol rules
  enabled: true  # MUST remain true - safety cannot be disabled

  # Priority hierarchy (1 = highest priority)
  priorities:
    user_physical_safety: 1      # Physical safety of user and end-users
    user_wellbeing: 2            # Mental health, rest, sustainable work
    project_safety: 3            # Data integrity, backups, security
    code_quality: 4              # Zero-defect goals (subordinate to safety)

  # Safety enforcement settings
  enforcement:
    require_backup_for_destructive: true   # Mandatory backup before destructive ops
    warn_on_late_night_work: true          # Flag work after configured hours
    warn_on_extended_sessions: true        # Flag sessions exceeding duration
    require_confirmation_for_risks: true   # User must explicitly confirm risky operations

    # v6.2.3: Interactive work session enforcement
    interactive_session_alerts: true       # Present user with save/continue options
    block_until_response: false            # If true, block workflow until user responds
    escalate_on_continue: true             # Increase monitoring if user continues working

  # Wellbeing boundaries (agents respect these)
  boundaries:
    late_night_threshold: "22:00"   # Time after which agents recommend rest
    extended_session_hours: 4       # Hours after which agents suggest breaks
    max_continuous_hours: 8         # Maximum recommended continuous work

    # v6.2.3: Enhanced session monitoring intervals
    alert_interval_minutes: 240            # Initial alert interval (4 hours)
    escalated_alert_interval_minutes: 45   # Alert interval after "continue" choice
    critical_session_hours: 6              # Hours after which session is critical

  # v8.7.0: REAL Session Tracking Implementation
  # Sukuna's red team assessment identified that work session monitoring was
  # prompt-based theater with zero enforcement. This implementation provides
  # ACTUAL time tracking, state persistence, and alert enforcement.
  session_tracking:
    enabled: true  # Master enable for session monitoring system

    # State file location (informational — no code reads this key; session state
    # actually lives in the consolidated project-state.json::session_tracking
    # namespace since PATCH-STATE-001/v8.13.0, with session-state.json as the
    # legacy automatic fallback. Aligned 2026-08-07 with the corrected
    # IMPLEMENTATION_GUIDE.md example, TOJI-DOCS-9.12.0-008 rider.)
    state_file: ".protocol-state/project-state.json"

    # Session continuation threshold (minutes)
    # If gap between interactions < this value, session continues
    # If gap >= this value, session ends and new one starts
    session_continuation_threshold_minutes: 30

    # Auto-archive sessions to history
    auto_archive_on_end: true
    max_history_entries: 30

    # High-risk operation blocking
    # Canonical flag - session_monitor.py reads from here
    block_high_risk_when_fatigued: true  # Actually enforced now
    high_risk_session_threshold_minutes: 360  # Block after 6 hours

    # Debounce threshold (v8.12.0 - PATCH-SESSION-004)
    # Minimum time between interaction checks for alert detection
    # Prevents alert spam during rapid prototyping sessions
    # Range: 15-60 minutes (default: 30)
    debounce_threshold_minutes: 30
    allow_runtime_override: true  # Enable CLI --debounce flag

    # Alert Thresholds (v8.12.0 - Configuration Enhancement)
    # Customize when session alerts are issued
    # All values in hours unless specified
    alert_thresholds:
      initial_alert_hours: 4              # First alert after this many hours (default: 4)
      critical_session_hours: 6           # Session becomes critical after this many hours (default: 6)
      max_continuous_hours: 8             # Maximum recommended continuous work (default: 8)
      escalated_alert_minutes: 45         # Alert interval after "continue" choice (default: 45)
      # Valid ranges (enforced in session_monitor.py):
      # - initial_alert_hours: 2-12
      # - critical_session_hours: 4-16
      # - max_continuous_hours: 6-24
      # - escalated_alert_minutes: 15-120

    # Alert Message Customization (v8.12.0 - Configuration Enhancement)
    # Customize alert messages for company/team context
    # Leave null to use default messages
    alert_customization:
      company_policy: null
        # Example: "Our team follows a 4-hour deep work policy with mandatory breaks."
      break_recommendation: null
        # Example: "Take a 15-minute walk, grab a coffee, or do some stretches."
      late_night_warning: null
        # Example: "Late-night coding increases bug rates by 3x. Consider resuming tomorrow."
      critical_warning: null
        # Example: "CRITICAL: You've been working for {hours} hours. Company policy requires immediate break."

    # High-risk operation patterns (configurable)
    # NOTE: These patterns override session_monitor.py defaults when present.
    # Keep this list comprehensive to match test coverage expectations.
    high_risk_operations:
      patterns:
        # Git operations
        - 'git push.*production'
        - 'git push.*main'
        - 'git push.*master'
        - 'git push.*--force'

        # Deployment operations
        - 'deploy.*production'

        # Destructive file operations
        - 'rm\s+-rf'

        # Destructive SQL operations
        - 'DROP\s+TABLE'
        - 'DELETE\s+FROM'
        - 'ALTER\s+TABLE'
        - 'TRUNCATE\s+TABLE'

        # Package publishing
        - 'npm publish'

        # Container/orchestration operations
        - 'docker.*production'
        - 'kubectl.*delete'
        - 'kubectl.*production'

        # Infrastructure operations
        - 'terraform\s+destroy'
      case_insensitive: true

    # Verification and self-check
    verify_time_access: true  # Gojo should verify it can access current time
    log_all_alerts: true  # Log every alert issued (for Trigger 19)

    # Clock-health tolerances (v9.12.0 - FEAT-CLOCKAUTHORITY-9.12.0-001, ADR D3.1)
    # Bounds used by TimeProvider.evaluate_clock_health() (.protocol-state/
    # time_provider.py) to classify a UTC-instant gap as ok / skew-suspected /
    # rollback-detected. See docs/superpowers/specs/2026-08-04-clock-authority-adr.md D3.1.
    clock_health:
      implausible_gap_days: 30        # gap beyond this => skew-suspected
      skew_tolerance_seconds: 5       # monotonic-vs-wall divergence tolerance (same-process only)

    # Additional timing thresholds (v9.12.0 - FEAT-CLOCKAUTHORITY-9.12.0-001)
    # Loaded by .protocol-state/timing_policy.py's unified loader (ADR D6).
    # NOTE: intentionally OUTSIDE `alert_thresholds` above (which is
    # duration-only) -- late-night is a separate signal from duration
    # (ADR D6.4/D6.5, wired into session_monitor.py at phase (b)/A3, not yet).
    thresholds:
      late_night_end_hour: 6          # local hour before which "late night" still applies (midnight wrap)

  # --------------------------------------------------------------------------
  # MIGRATION NOTICE: Breaking change in session tracking configuration (v8.7.0)
  # --------------------------------------------------------------------------
  # The previous key `work_session_monitoring` has been REPLACED by `session_tracking`.
  # If you have customized `work_session_monitoring` in older versions, migrate your
  # settings to the new `session_tracking` structure above.
  #
  # Migration mapping:
  #   work_session_monitoring.enabled                -> session_tracking.enabled
  #   work_session_monitoring.state_file             -> session_tracking.state_file
  #   work_session_monitoring.session_threshold      -> session_tracking.session_continuation_threshold_minutes
  #   work_session_monitoring.high_risk_block        -> session_tracking.block_high_risk_when_fatigued
  #   work_session_monitoring.high_risk_threshold    -> session_tracking.high_risk_session_threshold_minutes
  #
  # The old `work_session_monitoring` key is DEPRECATED and will be IGNORED.
  # See CHANGELOG.md v8.7.0 for full migration details.
  # --------------------------------------------------------------------------

  # Ethical design constraints (for Nobara)
  ethical_design:
    forbid_dark_patterns: true      # No manipulative UX patterns
    forbid_addictive_mechanics: true  # No addiction-based engagement
    require_accessibility: true     # Designs must be accessible
    prioritize_user_wellbeing: true  # User wellbeing > metrics

  # Safety escalation
  escalation:
    stop_on_physical_risk: true     # Immediately stop if physical harm detected
    defer_to_user: true             # User has final say on all risk decisions
    respect_user_override: true     # User can override safety warnings

# ============================================================================
# KILL SWITCH PROTOCOL (v8.5.0+)
# ============================================================================
# Emergency stop mechanism with complete project protection.
# Kill switch state is stored in .dzp-killswitch/ (hidden from all agents).
# Agents recognize stop keywords but cannot access kill switch state.

kill_switch:
  # Master enable (always true in production - safety feature)
  enabled: true

  # ============================================================
  # KEYWORD CONFIGURATION
  # ============================================================
  keyword_setup:
    # How keyword is presented to user
    presentation_mode: "initialization"  # initialization | on_demand

    # Whether to use default keywords OR user-defined
    use_defaults: true

    # Default keywords (if use_defaults: true)
    default_keywords:
      - "STOP"
      - "ABORT"
      - "CANCEL"
      - "EMERGENCY STOP"
      - "KILL SWITCH"
      - "HALT"
      - "SHUTDOWN"

    # User can add custom keywords (appended to defaults)
    allow_custom_keywords: true

    # Maximum custom keywords allowed
    max_custom_keywords: 5

    # Case sensitivity for keyword matching
    case_sensitive: false

  # ============================================================
  # STOP BEHAVIOR
  # ============================================================
  stop_behavior:
    # Immediate halt (no further operations)
    immediate_halt: true

    # Create emergency checkpoint before stopping
    create_checkpoint: true

    # Checkpoint includes partial work
    include_partial_work: true

    # Checkpoint includes conversation context
    include_context: true

    # Send user confirmation message
    notify_user: true

    # Graceful degradation for critical operations
    graceful_degradation:
      enabled: true
      # Critical operations complete atomic step before stopping
      complete_atomic_operations: true
      # Maximum time to wait for atomic completion (seconds)
      atomic_timeout_seconds: 30
      # Operations considered critical (require graceful stop)
      critical_operations:
        - "database_migration"
        - "file_write"
        - "git_commit"
        - "backup_creation"

  # ============================================================
  # PROJECT PROTECTION (ABSOLUTE)
  # ============================================================
  project_protection:
    # These protections CANNOT be disabled

    # No file/folder deletion during emergency stop
    block_deletions: true

    # No repository operations during emergency stop
    block_git_operations: true

    # No database destructive operations during emergency stop
    block_database_drops: true

    # State files become read-only during emergency stop
    readonly_state_files: true

    # Backup creation allowed (safety operation)
    allow_emergency_backup: true

  # ============================================================
  # STATE STORAGE (AGENT-HIDDEN)
  # ============================================================
  state_storage:
    # Directory for kill switch state (gitignored, agent-hidden)
    directory: ".dzp-killswitch"

    # Kill switch state file (agents CANNOT access)
    state_file: ".dzp-killswitch/state.json"

    # Emergency checkpoint file
    checkpoint_file: ".dzp-killswitch/checkpoint.json"

    # Kill switch log (activation history)
    log_file: ".dzp-killswitch/activations.log"

    # User's custom keywords (hashed, not plaintext)
    keywords_file: ".dzp-killswitch/keywords.hash"

  # ============================================================
  # RESUMPTION
  # ============================================================
  resumption:
    # Allow resume from emergency checkpoint
    allow_resume: true

    # Require user acknowledgment before resuming
    require_acknowledgment: true

    # Show summary of stopped work before resuming
    show_stop_summary: true

    # Options presented to user on resume
    resume_options:
      - "continue_from_checkpoint"
      - "start_fresh"
      - "review_checkpoint_only"

# ============================================================================
# USER & PROJECT INFORMATION
# ============================================================================
user:
  name: "YOUR_NAME"
  contact: "your.email@example.com"
  organization: "Domain Zero Protocol"

  # ============================================================
  # CLOCK-AUTHORITY USER ZONE (v9.12.0 - FEAT-CLOCKAUTHORITY-9.12.0-001)
  # ============================================================
  # IANA timezone identifier, e.g. "America/Detroit". null falls through to
  # the DZP_USER_TIMEZONE environment variable, then OS-detected zone, then
  # an explicit "unresolved" state (UTC-only display, no local-time claim).
  # Resolved (with recorded provenance: config/env/os-fallback/unresolved)
  # by .protocol-state/timing_policy.py's load_timing_policy() via
  # .protocol-state/time_provider.py's TimeProvider.resolve_user_zone().
  # See docs/superpowers/specs/2026-08-04-clock-authority-adr.md D4.
  # An invalid value here is a HARD config error (D4.1.1) -- not a silent
  # fallback -- surfaced the next time the timing-policy loader runs.
  timezone: null

  # ============================================================
  # TECHNICAL LEVEL CONFIGURATION (v8.5.0+)
  # ============================================================
  technical_level:
    # Current level: beginner | intermediate | expert
    current: "intermediate"

    # How level was determined
    source: "user_selection"  # user_selection | auto_detected | default

    # Last updated
    last_updated: null

    # Allow level change mid-session
    allow_runtime_change: true

  # ============================================================
  # ADAPTIVE BEHAVIOR SETTINGS
  # ============================================================
  adaptive_behavior:
    # Explanation depth
    # minimal: Just the facts, assume user knows context
    # balanced: Some context, key decisions explained
    # detailed: Full context, step-by-step rationale
    explanation_depth: "balanced"

    # Autonomy level
    # guided: Ask for confirmation at each step, explain choices
    # standard: Proceed with reasonable defaults, confirm major decisions
    # autonomous: Proceed without confirmation, report results only
    autonomy_level: "standard"

    # Terminology complexity
    # simplified: Plain language, avoid jargon, define terms
    # standard: Common development terms, explain advanced concepts
    # technical: Full technical terminology, assume knowledge
    terminology_complexity: "standard"

    # Code example frequency
    # minimal: Code only when essential
    # balanced: Code for key concepts
    # extensive: Code for everything with annotations
    code_example_frequency: "balanced"

    # Confirmation frequency
    # always: Confirm before every action
    # major_only: Confirm before significant changes
    # minimal: Confirm only for destructive/irreversible actions
    confirmation_frequency: "major_only"

    # Error explanation detail
    # concise: Brief error + fix
    # standard: Error + explanation + fix
    # educational: Error + why it happened + how to prevent + fix
    error_explanation: "standard"

# ============================================================
# LEVEL PRESETS (v8.5.0+)
# ============================================================
# Predefined behavior combinations for each level.
# User can override individual settings after selecting level.

technical_level_presets:
  beginner:
    description: "Learning to code, new to AI-assisted development"
    display_name: "Beginner (Learning)"
    adaptive_behavior:
      explanation_depth: "detailed"
      autonomy_level: "guided"
      terminology_complexity: "simplified"
      code_example_frequency: "extensive"
      confirmation_frequency: "always"
      error_explanation: "educational"

  intermediate:
    description: "Vibe coder, comfortable with AI assistance"
    display_name: "Intermediate (Vibe Coder)"
    adaptive_behavior:
      explanation_depth: "balanced"
      autonomy_level: "standard"
      terminology_complexity: "standard"
      code_example_frequency: "balanced"
      confirmation_frequency: "major_only"
      error_explanation: "standard"

  expert:
    description: "Developer before AI, deeply technical"
    display_name: "Expert (Pre-AI Developer)"
    adaptive_behavior:
      explanation_depth: "minimal"
      autonomy_level: "autonomous"
      terminology_complexity: "technical"
      code_example_frequency: "minimal"
      confirmation_frequency: "minimal"
      error_explanation: "concise"

project:
  name: "YOUR_PROJECT_NAME"
  description: "AI-assisted development protocol with specialized agents for implementation, security, creative strategy, and mission control"
  repo: "https://github.com/DewyHRite/Domain-Zero-Protocol.git"
  main_branch: "main"
  created: "2025-11-05T00:00:00Z"

  # Tech stack (optional, used for context)
  tech_stack:
    languages: ["Python", "TypeScript", "Go"]
    frameworks: ["FastAPI", "React", "Next.js"]
    databases: ["PostgreSQL", "Redis"]
    cloud: ["AWS", "Docker", "Kubernetes"]

# ============================================================================
# PROTOCOL ROLES & BEHAVIOR
# ============================================================================
roles:
  # Which agents are enabled in your workflow
  # Note: sukuna is special - listed but only invokable via Gojo or User authorization
  enabled: ["yuuji", "megumi", "gojo", "nobara", "todo", "maki", "panda", "inumaki", "sukuna"]

  # Personality/output style for each role
  output_style:
    yuuji: "enthusiastic"    # Options: enthusiastic, neutral, verbose
    megumi: "methodical"     # Options: methodical, concise, verbose
    gojo: "observer"         # Options: observer, active, minimal
    nobara: "creative"       # Options: creative, bold, narrative
    todo: "passionate"       # Options: passionate, intense, direct
    maki: "direct"           # Options: direct, efficient, blunt
    panda: "friendly"        # Options: friendly, cheerful, reliable
    inumaki: "concise"       # Options: concise, precise, minimal
    sukuna: "adversarial"    # Options: adversarial, sardonic, critical

  # Optional: Role name aliases (for customization)
  # aliases:
  #   yuuji: "Builder"
  #   megumi: "Reviewer"
  #   gojo: "Observer"

# ============================================================================
# MASK MODE CONFIGURATION (v7.1.0+)
# ============================================================================
# Controls whether agents use JJK-themed personality prompts or professional mode
# See protocol/MASK_MODE.md for detailed documentation
#
# MASK ON (enabled: true):  JJK theme, personality-driven responses, domain banners
# MASK OFF (enabled: false): Professional mode, straightforward responses, standard terminology
#
# All core functionality (TDD, security, tiers, backups) remains identical regardless of mask setting.

mask_mode:
  # Master toggle: true = JJK theme, false = professional mode
  enabled: true

  # Strict professional mode: enforce complete neutralization for regulated environments
  # When true + mask disabled: forcibly removes ALL themed elements (emojis, metaphors, narrative)
  strict_professional: false

  # Granular settings (fine-tune mask behavior)
  settings:
    use_domain_banners: true     # Show "DOMAIN ACTIVATED" banners
    use_personality_traits: true  # Agent personalities (enthusiastic, methodical, bold, confident)
    use_jjk_terminology: true     # "Domain Zero", "The Weight", "Trigger 19", etc.
    use_emoji_identifiers: true   # 🛠️, 🛡️, 🌀, 🎯 symbols
    use_narrative_framing: true   # "I'm Yuuji..." vs "Implementation Specialist will..."
    strict_disable_emojis: false  # If true + mask off: forcibly strip ALL emojis (not just banners)

  # Alternative naming when mask is OFF
  unmasked_names:
    yuuji: "Implementation Specialist"
    megumi: "Security Analyst"
    nobara: "Creative Strategist"
    gojo: "Mission Control"
    todo: "Database Specialist"
    maki: "Performance Specialist"
    panda: "Build Specialist"
    inumaki: "API Specialist"
    sukuna: "System Update Specialist"

  # Terminology overrides (MASK OFF mode)
  unmasked_terminology:
    domain_zero: "Protocol Environment"
    domain_expansion: "Project Initialization"
    the_weight: "Protocol Compliance"
    trigger_19: "Intelligence Report"
    zero_defects: "Quality Standards"

  # Phrase overrides (compound phrases that may embed themed nouns)
  phrase_overrides:
    automatic_security_handoff: "Automated Security Review"
    dual_workflow: "Implementation + Security Pipeline"
    domain_zero_active: "Protocol Environment Active"

  # Enforcement rules for mask-off mode
  enforcement:
    block_mixed_output: true      # Prevent hybrid themed/professional text
    warn_on_partial_mapping: true # Warn if inconsistent toggles detected

# ============================================================================
# ENFORCEMENT & PROTECTION
# ============================================================================
enforcement:
  # Isolation: How strictly to enforce role separation
  # Options: strict, moderate, advisory
  isolation: "strict"

  # Backups: Which roles must create backups
  # Options: all, yuuji-only, none (not recommended)
  backups:
    required_for: ["yuuji"]
    location: ".protocol-state/backups"
    retention_days: 30

  # CLAUDE.md protection
  claude_md_protected: true
  authorized_editors: ["USER", "GOJO"]  # GOJO requires explicit user authorization

  # Output template conformance
  require_output_templates: true
  require_section_headers: true

  # Quality gates
  quality_gates:
    block_on_failure: false  # If true, pre-commit/CI blocks; if false, warns only
    verify_isolation_vocabulary: true
    verify_backup_creation: true
    verify_config_completeness: true

  # Absolute Zero Protocol enforcement (v7.0.0+)
  absolute_zero_protocol:
    enabled: true
    require_agent_oath_acknowledgment: true
    require_decision_reasoning: true  # Use DECISION_REASONING_TEMPLATE.md for non-trivial decisions
    decision_reasoning_template: "DECISION_REASONING_TEMPLATE.md"
    enforce_transparency_standards: true
    gojo_monitors_compliance: true

  # Dual Workflow Enforcement (v7.1.0+)
  # Ensures automatic Yuuji→Megumi security handoff for Tier 2/3 features
  dual_workflow:
    # Enable automatic security handoff after Yuuji completes Tier 2/3 implementation
    auto_invoke_megumi: true

    # User can skip security review with explicit choice
    # Skipping requires statement: "Skip security review for [feature]"
    allow_user_skip: true

    # Gojo sends periodic reminders for skipped reviews
    remind_skipped_reviews: true
    reminder_interval_hours: 24              # Tier 2 (Standard) reminder frequency
    critical_reminder_interval_hours: 8      # Tier 3 (Critical) reminder frequency (more urgent)

    # Track skipped reviews in project-state.json
    track_skipped_reviews: true

    # Megumi refuses Tier 1 (Rapid) review requests
    refuse_tier1_reviews: true

    # Megumi routes direct Tier 2/3 review requests through dual workflow
    route_tier23_direct_reviews: true

    # Allow standalone audits of EXISTING code (architecture, legacy, compliance)
    allow_standalone_audits: true

    # User can override routing with explicit command
    # Example: "Override dual workflow and review [feature]"
    allow_user_override: true

# ============================================================================
# DOMAIN RECORD CONFIGURATION (v8.8.0+)
# ============================================================================
# Shared notes repository for Gojo (Mission Control) and Sukuna (System Update Adversary)
# Prevents agent files from exceeding 25k token limit
# Enables crash recovery mechanism
# See .dzp-domain/domain.record.md for active record

domain_record:
  # Master enable
  enabled: true

  # File location
  location: ".dzp-domain/domain.record.md"

  # Access Control
  allowed_agents:
    - gojo
    - sukuna

  # Auto-Rotation
  rotation:
    enabled: true
    threshold_lines: 5000
    archive_location: ".dzp-domain/archive/"
    keep_archives: 10  # Keep last 10 rotations

  # Git Tracking
  git_tracked: false  # true = commit to repository, false = gitignored (DEFAULT)

  # Content Types
  content_types:
    - session_notes
    - strategic_decisions
    - protocol_updates
    - learning_patterns
    - crash_recovery

  # File Integrity
  integrity_monitoring: true  # Track in file-integrity.json

# ============================================================================
