paths:
  # Protocol core files
  protocol_dir: "protocol"
  state_dir: ".protocol-state"
  scripts_dir: "scripts"

  # State files
  # Note: session-state.json is gitignored (contains transient session data)
  # but work-session-alert.template.md is version controlled (template only)
  project_state: ".protocol-state/project-state.json"
  dev_notes: ".protocol-state/dev-notes.md"
  security_review: ".protocol-state/security-review.md"
  trigger_19: ".protocol-state/trigger-19.md"
  tier_spec: ".protocol-state/tier-system-specification.md"
  work_session_alert_template: ".protocol-state/work-session-alert.template.md"

  # Protocol files
  claude_md: "protocol/CLAUDE.md"
  yuuji_md: "protocol/yuuji.agent.md"
  megumi_md: "protocol/megumi.agent.md"
  nobara_md: "protocol/nobara.agent.md"
  gojo_md: "protocol/gojo.agent.md"
  todo_md: "protocol/todo.agent.md"
  maki_md: "protocol/maki.agent.md"
  panda_md: "protocol/panda.agent.md"
  inumaki_md: "protocol/inumaki.agent.md"
  sukuna_md: "protocol/sukuna.agent.md"
  tier_guide: "protocol/TIER-SELECTION-GUIDE.md"

  # Source code locations (adjust for your project)
  source_code: "src"
  tests: "tests"
  docs: "docs"

# ============================================================================
# TOOLING INTEGRATION
# ============================================================================
tooling:
  # Security scanning tools (optional)
  sast:
    enabled: false
    tools: ["snyk-code", "semgrep", "codeql"]
    run_on: ["tier_2_standard", "tier_3_critical"]

  sca:
    enabled: false
    tools: ["snyk-open-source", "dependabot"]
    run_on: ["tier_2_standard", "tier_3_critical"]

  dast:
    enabled: false
    tools: ["owasp-zap", "burp-suite"]
    run_on: ["tier_3_critical"]

  iac_scanning:
    enabled: false
    tools: ["snyk-iac", "checkov", "tfsec"]
    run_on: ["tier_3_critical"]

  # Testing frameworks (auto-detected if not specified)
  testing:
    framework: "auto-detect"  # or pytest, jest, junit, go-test, rspec, etc.
    coverage_target: 0.80
    coverage_tool: "auto-detect"  # or coverage.py, jest, jacoco, etc.

  # CI/CD integration
  ci_cd:
    provider: "github-actions"  # github-actions, gitlab-ci, jenkins, circleci
    verify_on_pr: true
    verify_on_commit: false
    required_checks: ["protocol-verify", "tests", "security-scan"]

# ============================================================================
# PRIVACY & MONITORING
# ============================================================================
privacy:
  # ============================================================
  # PASSIVE OBSERVER MODE (Gojo's Background Monitoring)
  # ============================================================
  #
  # ⚠️ IMPORTANT: Passive Observer is OFF by default for privacy.
  #
  # When OFF (default):
  #   ❌ No background monitoring or automatic enforcement
  #   ❌ No proactive nudges, backups, or risk escalation
  #   ❌ Gojo only available via explicit invocation
  #   ❌ Trigger 19 reports will be minimal/empty
  #   ✅ Privacy-focused: no session data collection
  #   ✅ Manual checkpoints via PR templates required
  #
  # When ON (opt-in):
  #   ✅ Proactive safety and automatic enforcement
  #   ✅ Background monitoring and pattern detection
  #   ✅ Rich intelligence reports (Trigger 19)
  #   ✅ Session continuity tracking
  #   ⚠️ Session data collected (local storage, gitignored)
  #   ⚠️ Requires explicit consent
  #
  # See PASSIVE_OBSERVER.md for:
  #   - Detailed comparison (OFF vs ON)
  #   - Privacy and consent considerations
  #   - When to enable/disable
  #   - Passive-Off checklist for PR templates
  #
  # ============================================================

  passive_monitoring:
    enabled: false              # OFF by default (set to true to enable)
    consent_given: false        # REQUIRED: Must be true to enable
    consent_date: null          # ISO 8601 date when consent was given
    data_retention_days: 14     # How long to keep session observations
    storage_location: "local"   # local = never uploaded | encrypted | cloud

  # trigger-19.md gitignore status
  gitignore_trigger_19: true    # Always gitignore by default (never commit)

  # GDPR compliance mode
  gdpr_mode: false              # If true, additional privacy safeguards enabled

# ============================================================================
# RESEARCH MODE (v7.2.0+)
# ============================================================================
# Enables agents to perform structured, auditable research on evolving best practices
# See protocol/RESEARCH_MODE.md for complete specification
#
# Purpose:
# - Keep agents current on implementation patterns, security standards, UX guidelines
# - Produce structured, citable outputs with provenance and confidence indicators
# - Avoid protocol drift by confining research to dedicated state artifacts
# - Privacy-respecting: raw notes gitignored, only curated summaries tracked

research:
  # Master toggle (Gojo enforces if false)
  enabled: true

  # Which agents are allowed to perform research
  allowed_agents: ["yuuji", "megumi", "nobara", "gojo", "todo", "maki", "panda", "inumaki"]

  # Research cadence per agent
  cadence:
    yuuji: "weekly"            # Implementation patterns, TDD tooling updates
    megumi: "weekly"           # OWASP revisions, emerging vulnerabilities, cryptography
    nobara: "biweekly"         # WCAG updates, UX guidelines, accessibility tooling
    gojo: "monthly"            # Meta trends, coordination tooling, risk landscape
    todo: "weekly"             # Database patterns, ORM updates, migration strategies
    maki: "weekly"             # Performance tooling, profiling updates, optimization patterns
    panda: "biweekly"          # CI/CD patterns, build tooling, GitHub Actions updates
    inumaki: "biweekly"        # API design patterns, OpenAPI updates, protocol standards

  # Session constraints
  max_session_minutes: 25      # Hard cap per session to prevent fatigue

  # Source policy
  source_policy:
    max_sources: 12
    min_primary_sources: 3     # Authoritative standards (RFC, OWASP, W3C, ISO, NIST)
    allow_blogs: true
    allow_forums: false        # Avoid low-moderation sources by default
    require_publication_year: true
    freshness_years: 3         # Prefer sources <= 3 years old unless canonical
    # Canonical sources are exempt from freshness requirements (standards remain authoritative)
    canonical_sources_exempt_from_freshness: true
    # Auto-detect canonical sources by domain/pattern
    canonical_source_patterns:
      - "*.rfc-editor.org"
      - "owasp.org"
      - "*.nist.gov"
      - "*.w3.org"
      - "*.iso.org"

  # Citation format
  citation:
    style: "domain-zero-v1"    # Custom inline format (see RESEARCH_MODE.md)
    include_access_timestamp: true
    include_confidence: true

  # Output configuration
  output:
    aggregate_index: ".protocol-state/research/research-index.json"
    per_agent_dir: ".protocol-state/research/{agent}"  # Dynamic pathing
    summary_filename: "summary.md"      # Curated digest (version controlled optional)
    raw_notes_filename: "raw.log"       # Gitignored scratchpad

  # Privacy settings
  privacy:
    gitignore_raw: true         # Raw notes never committed
    redact_pii: true            # Automatic PII redaction
    store_urls_only: true       # Fetch summary passages; avoid full dumps

  # Verification gates
  verification:
    run_plagiarism_check: false      # Placeholder for future tool integration
    require_dual_source_corrob: true # All high confidence items need 2+ sources
    require_security_vuln_crossref: true  # Megumi only: map to OWASP/CVE/NIST

  # Staleness detection
  escalation:
    stale_days_warning: 14           # Notify if no update beyond X days
    critical_domain_stale_days: 7    # OWASP / auth / encryption topics

  # Role-specific focus areas (see RESEARCH_MODE.md § 7)
  role_focus:
    yuuji:
      primary: ["implementation patterns", "TDD tooling", "test isolation"]
      secondary: ["build performance", "async patterns"]
      exclusions: ["direct protocol edits"]
    megumi:
      primary: ["OWASP updates", "emerging vulnerabilities", "cryptography papers"]
      secondary: ["performance-security ties", "compliance standards"]
      exclusions: ["implementation patches"]
    nobara:
      primary: ["WCAG guidelines", "usability heuristics", "onboarding flows"]
      secondary: ["accessibility tooling", "inclusive design"]
      exclusions: ["low-quality marketing blogs"]
    gojo:
      primary: ["meta trends", "coordination tooling", "risk landscape"]
      secondary: ["process optimization metrics", "protocol governance"]
      exclusions: ["direct feature design"]
    todo:
      primary: ["database design patterns", "ORM best practices", "migration strategies"]
      secondary: ["query optimization", "data modeling", "indexing strategies"]
      exclusions: ["frontend implementation"]
    maki:
      primary: ["performance profiling", "bundle optimization", "runtime analysis"]
      secondary: ["memory management", "caching strategies", "load testing"]
      exclusions: ["security audits"]
    panda:
      primary: ["CI/CD patterns", "build optimization", "GitHub Actions"]
      secondary: ["Docker best practices", "integration testing", "deployment strategies"]
      exclusions: ["business logic implementation"]
    inumaki:
      primary: ["REST API design", "GraphQL patterns", "OpenAPI specification"]
      secondary: ["WebSocket protocols", "API versioning", "rate limiting patterns"]
      exclusions: ["database design"]

