# Domain Zero Protocol Configuration
# Version: 8.7.0
# This file serves as the canonical source of truth for all protocol parameters
# Modify this file to customize Domain Zero for your project

# ============================================================================
# CANONICAL REPOSITORY (Source of Truth)
# ============================================================================
canonical_repository:
  url: "https://github.com/DewyHRite/Domain-Zero-Protocol"
  version: "v8.7.0"
  commit: "<PINNED_SHA>"  # OPTIONAL: Replace with specific commit SHA for strict version pinning
                           # Leave as placeholder if tracking version tag instead
  auto_update:
    enabled: false          # Set true if downstream wants automatic pulls
    strategy: "tag"         # tag | commit | latest
    check_on_verify: true   # Verification script warns on mismatch

# ============================================================================
# SAFETY & WELLBEING (ABSOLUTE PRIORITY)
# ============================================================================
# User safety and wellbeing override ALL other protocol objectives.
# No agent, not even Gojo, may compromise user safety under any circumstances.

safety:
  # User safety principles - these override all other protocol rules
  enabled: true  # MUST remain true - safety cannot be disabled

  # Priority hierarchy (1 = highest priority)
  priorities:
    user_physical_safety: 1      # Physical safety of user and end-users
    user_wellbeing: 2            # Mental health, rest, sustainable work
    project_safety: 3            # Data integrity, backups, security
    code_quality: 4              # Zero-defect goals (subordinate to safety)

  # Safety enforcement settings
  enforcement:
    require_backup_for_destructive: true   # Mandatory backup before destructive ops
    warn_on_late_night_work: true          # Flag work after configured hours
    warn_on_extended_sessions: true        # Flag sessions exceeding duration
    require_confirmation_for_risks: true   # User must explicitly confirm risky operations

    # v6.2.3: Interactive work session enforcement
    interactive_session_alerts: true       # Present user with save/continue options
    block_until_response: false            # If true, block workflow until user responds
    escalate_on_continue: true             # Increase monitoring if user continues working

  # Wellbeing boundaries (agents respect these)
  boundaries:
    late_night_threshold: "22:00"   # Time after which agents recommend rest
    extended_session_hours: 4       # Hours after which agents suggest breaks
    max_continuous_hours: 8         # Maximum recommended continuous work

    # v6.2.3: Enhanced session monitoring intervals
    alert_interval_minutes: 240            # Initial alert interval (4 hours)
    escalated_alert_interval_minutes: 45   # Alert interval after "continue" choice
    critical_session_hours: 6              # Hours after which session is critical

  # v8.7.0: REAL Session Tracking Implementation
  # Sukuna's red team assessment identified that work session monitoring was
  # prompt-based theater with zero enforcement. This implementation provides
  # ACTUAL time tracking, state persistence, and alert enforcement.
  session_tracking:
    enabled: true  # Master enable for session monitoring system

    # State file location
    state_file: ".protocol-state/session-state.json"

    # Session continuation threshold (minutes)
    # If gap between interactions < this value, session continues
    # If gap >= this value, session ends and new one starts
    session_continuation_threshold_minutes: 30

    # Auto-archive sessions to history
    auto_archive_on_end: true
    max_history_entries: 30

    # High-risk operation blocking
    # Canonical flag - session_monitor.py reads from here
    block_high_risk_when_fatigued: true  # Actually enforced now
    high_risk_session_threshold_minutes: 360  # Block after 6 hours

    # High-risk operation patterns (configurable)
    # NOTE: These patterns override session_monitor.py defaults when present.
    # Keep this list comprehensive to match test coverage expectations.
    high_risk_operations:
      patterns:
        # Git operations
        - 'git push.*production'
        - 'git push.*main'
        - 'git push.*master'
        - 'git push.*--force'

        # Deployment operations
        - 'deploy.*production'

        # Destructive file operations
        - 'rm\s+-rf'

        # Destructive SQL operations
        - 'DROP\s+TABLE'
        - 'DELETE\s+FROM'
        - 'ALTER\s+TABLE'
        - 'TRUNCATE\s+TABLE'

        # Package publishing
        - 'npm publish'

        # Container/orchestration operations
        - 'docker.*production'
        - 'kubectl.*delete'
        - 'kubectl.*production'

        # Infrastructure operations
        - 'terraform\s+destroy'
      case_insensitive: true

    # Verification and self-check
    verify_time_access: true  # Gojo should verify it can access current time
    log_all_alerts: true  # Log every alert issued (for Trigger 19)

  # --------------------------------------------------------------------------
  # MIGRATION NOTICE: Breaking change in session tracking configuration (v8.7.0)
  # --------------------------------------------------------------------------
  # The previous key `work_session_monitoring` has been REPLACED by `session_tracking`.
  # If you have customized `work_session_monitoring` in older versions, migrate your
  # settings to the new `session_tracking` structure above.
  #
  # Migration mapping:
  #   work_session_monitoring.enabled                -> session_tracking.enabled
  #   work_session_monitoring.state_file             -> session_tracking.state_file
  #   work_session_monitoring.session_threshold      -> session_tracking.session_continuation_threshold_minutes
  #   work_session_monitoring.high_risk_block        -> session_tracking.block_high_risk_when_fatigued
  #   work_session_monitoring.high_risk_threshold    -> session_tracking.high_risk_session_threshold_minutes
  #
  # The old `work_session_monitoring` key is DEPRECATED and will be IGNORED.
  # See CHANGELOG.md v8.7.0 for full migration details.
  # --------------------------------------------------------------------------

  # Ethical design constraints (for Nobara)
  ethical_design:
    forbid_dark_patterns: true      # No manipulative UX patterns
    forbid_addictive_mechanics: true  # No addiction-based engagement
    require_accessibility: true     # Designs must be accessible
    prioritize_user_wellbeing: true  # User wellbeing > metrics

  # Safety escalation
  escalation:
    stop_on_physical_risk: true     # Immediately stop if physical harm detected
    defer_to_user: true             # User has final say on all risk decisions
    respect_user_override: true     # User can override safety warnings

# ============================================================================
# KILL SWITCH PROTOCOL (v8.5.0+)
# ============================================================================
# Emergency stop mechanism with complete project protection.
# Kill switch state is stored in .dzp-killswitch/ (hidden from all agents).
# Agents recognize stop keywords but cannot access kill switch state.

kill_switch:
  # Master enable (always true in production - safety feature)
  enabled: true

  # ============================================================
  # KEYWORD CONFIGURATION
  # ============================================================
  keyword_setup:
    # How keyword is presented to user
    presentation_mode: "initialization"  # initialization | on_demand

    # Whether to use default keywords OR user-defined
    use_defaults: true

    # Default keywords (if use_defaults: true)
    default_keywords:
      - "STOP"
      - "ABORT"
      - "CANCEL"
      - "EMERGENCY STOP"
      - "KILL SWITCH"
      - "HALT"
      - "SHUTDOWN"

    # User can add custom keywords (appended to defaults)
    allow_custom_keywords: true

    # Maximum custom keywords allowed
    max_custom_keywords: 5

    # Case sensitivity for keyword matching
    case_sensitive: false

  # ============================================================
  # STOP BEHAVIOR
  # ============================================================
  stop_behavior:
    # Immediate halt (no further operations)
    immediate_halt: true

    # Create emergency checkpoint before stopping
    create_checkpoint: true

    # Checkpoint includes partial work
    include_partial_work: true

    # Checkpoint includes conversation context
    include_context: true

    # Send user confirmation message
    notify_user: true

    # Graceful degradation for critical operations
    graceful_degradation:
      enabled: true
      # Critical operations complete atomic step before stopping
      complete_atomic_operations: true
      # Maximum time to wait for atomic completion (seconds)
      atomic_timeout_seconds: 30
      # Operations considered critical (require graceful stop)
      critical_operations:
        - "database_migration"
        - "file_write"
        - "git_commit"
        - "backup_creation"

  # ============================================================
  # PROJECT PROTECTION (ABSOLUTE)
  # ============================================================
  project_protection:
    # These protections CANNOT be disabled

    # No file/folder deletion during emergency stop
    block_deletions: true

    # No repository operations during emergency stop
    block_git_operations: true

    # No database destructive operations during emergency stop
    block_database_drops: true

    # State files become read-only during emergency stop
    readonly_state_files: true

    # Backup creation allowed (safety operation)
    allow_emergency_backup: true

  # ============================================================
  # STATE STORAGE (AGENT-HIDDEN)
  # ============================================================
  state_storage:
    # Directory for kill switch state (gitignored, agent-hidden)
    directory: ".dzp-killswitch"

    # Kill switch state file (agents CANNOT access)
    state_file: ".dzp-killswitch/state.json"

    # Emergency checkpoint file
    checkpoint_file: ".dzp-killswitch/checkpoint.json"

    # Kill switch log (activation history)
    log_file: ".dzp-killswitch/activations.log"

    # User's custom keywords (hashed, not plaintext)
    keywords_file: ".dzp-killswitch/keywords.hash"

  # ============================================================
  # RESUMPTION
  # ============================================================
  resumption:
    # Allow resume from emergency checkpoint
    allow_resume: true

    # Require user acknowledgment before resuming
    require_acknowledgment: true

    # Show summary of stopped work before resuming
    show_stop_summary: true

    # Options presented to user on resume
    resume_options:
      - "continue_from_checkpoint"
      - "start_fresh"
      - "review_checkpoint_only"

# ============================================================================
# USER & PROJECT INFORMATION
# ============================================================================
user:
  name: "Dewy"
  contact: "dewy@domain-zero-protocol.dev"
  organization: "Domain Zero Protocol"

  # ============================================================
  # TECHNICAL LEVEL CONFIGURATION (v8.5.0+)
  # ============================================================
  technical_level:
    # Current level: beginner | intermediate | expert
    current: "intermediate"

    # How level was determined
    source: "user_selection"  # user_selection | auto_detected | default

    # Last updated
    last_updated: null

    # Allow level change mid-session
    allow_runtime_change: true

  # ============================================================
  # ADAPTIVE BEHAVIOR SETTINGS
  # ============================================================
  adaptive_behavior:
    # Explanation depth
    # minimal: Just the facts, assume user knows context
    # balanced: Some context, key decisions explained
    # detailed: Full context, step-by-step rationale
    explanation_depth: "balanced"

    # Autonomy level
    # guided: Ask for confirmation at each step, explain choices
    # standard: Proceed with reasonable defaults, confirm major decisions
    # autonomous: Proceed without confirmation, report results only
    autonomy_level: "standard"

    # Terminology complexity
    # simplified: Plain language, avoid jargon, define terms
    # standard: Common development terms, explain advanced concepts
    # technical: Full technical terminology, assume knowledge
    terminology_complexity: "standard"

    # Code example frequency
    # minimal: Code only when essential
    # balanced: Code for key concepts
    # extensive: Code for everything with annotations
    code_example_frequency: "balanced"

    # Confirmation frequency
    # always: Confirm before every action
    # major_only: Confirm before significant changes
    # minimal: Confirm only for destructive/irreversible actions
    confirmation_frequency: "major_only"

    # Error explanation detail
    # concise: Brief error + fix
    # standard: Error + explanation + fix
    # educational: Error + why it happened + how to prevent + fix
    error_explanation: "standard"

# ============================================================
# LEVEL PRESETS (v8.5.0+)
# ============================================================
# Predefined behavior combinations for each level.
# User can override individual settings after selecting level.

technical_level_presets:
  beginner:
    description: "Learning to code, new to AI-assisted development"
    display_name: "Beginner (Learning)"
    adaptive_behavior:
      explanation_depth: "detailed"
      autonomy_level: "guided"
      terminology_complexity: "simplified"
      code_example_frequency: "extensive"
      confirmation_frequency: "always"
      error_explanation: "educational"

  intermediate:
    description: "Vibe coder, comfortable with AI assistance"
    display_name: "Intermediate (Vibe Coder)"
    adaptive_behavior:
      explanation_depth: "balanced"
      autonomy_level: "standard"
      terminology_complexity: "standard"
      code_example_frequency: "balanced"
      confirmation_frequency: "major_only"
      error_explanation: "standard"

  expert:
    description: "Developer before AI, deeply technical"
    display_name: "Expert (Pre-AI Developer)"
    adaptive_behavior:
      explanation_depth: "minimal"
      autonomy_level: "autonomous"
      terminology_complexity: "technical"
      code_example_frequency: "minimal"
      confirmation_frequency: "minimal"
      error_explanation: "concise"

project:
