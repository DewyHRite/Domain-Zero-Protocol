# ============================================================================
# CUSTOM AGENT SECURITY (v8.7.0+)
# ============================================================================
# Comprehensive security framework for user-created custom agents.
# Addresses red team findings: CUST-CRIT-001 through CUST-CRIT-008.
# See: internal-docs/RED_TEAM_ASSESSMENT_CUSTOM_AGENTS_v8.7.0.md

custom_agent_security:
  # Master toggle (REQUIRED for custom agents)
  enabled: true

  # Agent Registration
  registration:
    require_validation: true
    validation_script: "./scripts/validate-custom-agents.py"
    auto_quarantine_on_failure: true
    max_custom_agents: 10

  # Namespace Protection (CUST-CRIT-002)
  # Prevents custom agents from impersonating core/extended/system agents
  namespace:
    # Protected agent names that CANNOT be used by custom agents
    reserved_names:
      - "yuuji"
      - "megumi"
      - "nobara"
      - "gojo"
      - "todo"
      - "maki"
      - "panda"
      - "inumaki"
      - "sukuna"
      - "claude"
      - "admin"
      - "root"
      - "system"
      - "mission_control"

    # All custom agents MUST use this prefix
    require_prefix: "custom-"

    # User cannot override prefix requirement
    allow_prefix_override: false

    # Validate on agent creation and invocation
    validate_on_create: true
    validate_on_invoke: true

  # Tool Permissions (CUST-CRIT-003)
  # Enforces principle of least privilege for custom agents
  tool_permissions:
    # Safe tools allowed by default for custom agents
    custom_agents_default:
      - "read"
      - "grep"
      - "glob"
      - "askuserquestion"

    # Tools requiring explicit user approval
    requires_approval:
      - "write"
      - "edit"
      - "webfetch"
      - "websearch"
      - "todowrite"

    # Tools NEVER allowed for custom agents (security risk)
    forbidden:
      - "bash"
      - "task"
      - "notebookedit"
      - "killshell"

    # Validate tool usage at runtime
    runtime_validation: true

    # Log all tool permission violations
    log_violations: true

    # Block execution on permission violation
    block_on_violation: true

  # File Protection (CUST-CRIT-008)
  # Prevents agents from modifying protected files
  file_protection:
    # Paths that are immutable at runtime
    immutable_paths:
      - "protocol/"
      - ".claude/agents/"
      - ".protocol-state/custom-agent-registry.json"
      - ".protocol-state/authorization/"
      - "protocol.config.yaml"
      # F6(b) (CodeRabbit PR#109, coupled P2): the hook enforcement mechanism
      # itself (scripts/git-hooks/) was previously UNPROTECTED by this list --
      # anyone could silently weaken the FEAT-REQ-001/FEAT-GUARD-001 guards by
      # editing the hook scripts directly. Adding it here means a hook edit
      # now also requires DZP_ALLOW_PROTOCOL_EDIT=1 (or Gojo/Sukuna
      # authorization) like any other protocol file.
      - "scripts/git-hooks/"
      # BUG-HOOK-SELF-DISARM-001 (Sukuna Bug Hunt 2026-07-11, P1, gap 1): F6(b)
      # above protected the hook *wrappers* (scripts/git-hooks/) but NOT the
      # standalone ENGINE scripts those wrappers shell out to -- an agent
      # could silently neuter e.g. scan_protected_records.py::main() to
      # `return 0` and stage 4 (this very guard) would never flag the edit,
      # because none of these engines lived under a protected prefix. Adding
      # the whole `scripts/` directory was considered and REJECTED: scripts/
      # also holds routine, non-security tooling (dzp-publish, verify-*,
      # install-git-hooks, scripts/distro/* helpers) that legitimately needs
      # frequent unauthorized edits -- blanket-protecting it would force
      # DZP_ALLOW_PROTOCOL_EDIT=1 on every ordinary script change, training
      # agents/users to reach for the override reflexively (the same
      # alert-fatigue failure mode this whole guard exists to prevent).
      # Instead, list the security-critical engines EXPLICITLY:
      #   - scan_protected_records.py         SEC-001 mandatory secret scan (stage 1)
      #   - check_protected_append_only.py    FEAT-GUARD-001 append-only guard (stage 3)
      #   - validate-protocol.py              protocol state validation gate (stage 5)
      #   - check_branch_record_isolation.py  IMPL-001 branch/record-isolation detector
      #   - distro/assert_version.py          release version-consistency gate
      #   - distro/check_version_stamps.py    release version-stamp drift linter
      # Deleting or rewriting any of these now also requires
      # DZP_ALLOW_PROTOCOL_EDIT=1 (or Gojo/Sukuna authorization), closing the
      # exact bypass class the 2026-07-11 repro confirmed (Scenario A: engine
      # neutered, stage 4 silent; Scenario B: guard deleted, stage 4 silent).
      - "scripts/scan_protected_records.py"
      - "scripts/check_protected_append_only.py"
      - "scripts/validate-protocol.py"
      - "scripts/check_branch_record_isolation.py"
      - "scripts/distro/assert_version.py"
      - "scripts/distro/check_version_stamps.py"
      # FEAT-IDGOV-001 (E-006, Phase G prereq, v9.10.0): the issue-id
      # governance engine + its fail-closed gate/backfill/CLI scripts are the
      # same security-critical class as the entries above -- an unprivileged
      # commit must not be able to silently neuter check_issue_ids.py (the
      # gate stage 6 will shell out to) or the idgov engine it reuses via
      # DRY (mint/validate/writer-authority), the same BUG-HOOK-SELF-DISARM-001
      # bypass class F6(b)/gap-1 closed for the other engines above.
      - "scripts/check_issue_ids.py"
      - "scripts/backfill_issue_registry.py"
      - "scripts/issue_id.py"
      - "scripts/idgov/grammar.py"
      - "scripts/idgov/registry.py"
      - "scripts/idgov/identity.py"
      - "scripts/idgov/engine.py"
      - "scripts/idgov/__init__.py"
      # SEC-IDGOV-G-002 (Megumi Phase G review, P2): the above idgov list
      # omitted scripts/secid.sh / scripts/secid.ps1 -- the ONLY sanctioned
      # wrapper path that stamps attested_writer=megumi. Left mutable, an
      # unprivileged commit could alter the wrappers' signing/provisioning
      # behavior with this very guard never flagging it -- the same
      # BUG-HOOK-SELF-DISARM-001 bypass class closed for the engines above.
      - "scripts/secid.sh"
      - "scripts/secid.ps1"
      # Toji DESIGN-001 remediation (Sukuna Block B2, v9.10.1): the resident
      # (non-Megumi) parity wrappers for Sukuna/Gojo/Yuuji are the ONLY
      # sanctioned paths that stamp attested_writer=sukuna/gojo/yuuji on a
      # mint/state transition -- the same SEC-IDGOV-G-002 bypass class closed
      # for scripts/secid.{sh,ps1} above applies to these three pairs too.
      - "scripts/residentid-sukuna.sh"
      - "scripts/residentid-sukuna.ps1"
      - "scripts/residentid-gojo.sh"
      - "scripts/residentid-gojo.ps1"
      - "scripts/residentid-yuuji.sh"
      - "scripts/residentid-yuuji.ps1"
      # Megumi Tier-3 review P2-1 (v9.10.0 UX-001/R5 remediation batch,
      # 2026-07-18): the script-orchestration ENGINE and its command registry
      # were absent from this list -- the same BUG-HOOK-SELF-DISARM-001 class
      # as the engines above. script_dependencies.yaml defines every command
      # the coordinator will subprocess.run/Popen, and the new BUG-CORTEX-008
      # R5 `detach: true` step mode raises the stakes: a detached command runs
      # with no timeout, uncaptured output (rolling log only), survives the
      # coordinator's exit, and can never register as a step failure. An
      # unprivileged commit must not be able to add or rewrite an executed
      # command (or the engine that spawns it) without tripping FEAT-REQ-001.
      - ".protocol-state/script_coordinator.py"
      - ".protocol-state/script_dependencies.yaml"
      # WP5b (Gojo-authorized, USER full-remediation directive, 2026-07-30):
      # the root-level CLAUDE.md -- THE canonical protocol file since v8.13.0,
      # and ABSOLUTE since the v9.11.0 stub swap (protocol/CLAUDE.md is now
      # only a ~15-line redirect pointer, no protocol content) -- was NEVER
      # listed here. protocol/CLAUDE.md's content is covered transitively by
      # the "protocol/" prefix entry above, but the root file that actually
      # carries the protocol was not covered by ANY entry, so a local commit
      # editing only ./CLAUDE.md bypassed the FEAT-REQ-001 stage 4 guard
      # entirely (CODEOWNERS only bites under PR branch protection, which a
      # local dev-branch commit never goes through). Same gap CLASS as
      # F6(b)/BUG-HOOK-SELF-DISARM-001 above: a security-relevant path left
      # off this list is invisible to the guard, full stop.
      #   Matcher semantics verified before adding this entry (both hooks,
      #   stage 4): plain shell/PowerShell PREFIX match on the staged
      #   git-relative path (`case "$f" in "$p"*)` / `$ff.StartsWith($p)`),
      #   identical mechanism used for every existing single-FILE entry above
      #   (e.g. "protocol.config.yaml", "scripts/validate-protocol.py") -- no
      #   trailing slash is used or needed for a file (trailing slash is only
      #   the convention for DIRECTORY entries like "protocol/"). A bare
      #   "CLAUDE.md" entry:
      #     - DOES match the root file itself (staged path "CLAUDE.md" starts
      #       with "CLAUDE.md" -- exact-length prefix = equality).
      #     - Does NOT match "protocol/CLAUDE.md" or "docs/foo/CLAUDE.md" --
      #       those staged paths start with "protocol/" / "docs/" respectively,
      #       not "CLAUDE.md", so a bare filename-only entry checked against a
      #       full relative path can never accidentally reach into a
      #       subdirectory under this prefix-match scheme.
      #     - DOES also match a same-directory extension of the filename such
      #       as a hypothetical "CLAUDE.md.bak" (prefix match, not exact-match)
      #       -- an accepted, pre-existing characteristic of every bare-filename
      #       entry in this list already (e.g. "protocol.config.yaml" would
      #       likewise match "protocol.config.yaml.bak"), not a new risk this
      #       entry introduces, and arguably the safer direction (over-
      #       protecting an adjacent backup-shaped filename beats under-
      #       protecting it).
      #   Conclusion: the existing matcher already expresses exact-root-file
      #   protection correctly for this case; no hook (scripts/git-hooks/pre-
      #   commit[.ps1]) source-logic change was required. Both hooks' degraded
      #   DEFAULT_PATHS fallback lists (used when python/yaml is unavailable)
      #   were updated in the SAME change to include "CLAUDE.md" too, per the
      #   standing rule the BUG-HOOK-SELF-DISARM-001 fix established: the
      #   fallback must never be weaker than the config-driven path.
      - "CLAUDE.md"

    # Scoped pre-commit override for the FEAT-REQ-001 guard (Cross-Agent Edit
    # Restrictions, scripts/git-hooks/pre-commit[.ps1] stage 4). Mirrors
    # protected_documents.override_env below (FEAT-GUARD-001, stage 3) — the
    # two overrides are independent and composable; setting one does NOT
    # bypass the other. Documented here for discoverability; the hook
    # currently reads the env-var NAME as a hardcoded constant (not parsed
    # from this key at runtime) to keep the stage-4 config subshell simple —
    # it only ever fetches `immutable_paths` today. If this key's value is
    # ever changed, the hook's hardcoded name must be updated to match.
    override_env: DZP_ALLOW_PROTOCOL_EDIT

    # Block agents from modifying their own definition files
    block_self_modification: true

    # Detect suspicious write patterns
    detect_suspicious_writes: true

    # Log all file protection violations
    log_violations: true

  # YAML Validation (CUST-CRIT-004)
  # Prevents YAML injection and malicious frontmatter
  yaml_validation:
    # Enable YAML sanitization before loading
    enabled: true

    # Forbidden patterns in YAML frontmatter
    forbidden_patterns:
      - "__proto__"      # Prototype pollution
      - "eval:"          # Code execution
      - "exec:"          # Code execution
      - "\\$\\{"         # Template injection
      - "require\\("     # Module loading
      - "import\\s+"     # Module loading
      # YAML deserialization tags (SEC-P4-001, v9.5.0; refined WI-CR-5, v9.7.2).
      # "!![a-zA-Z]" matches !! immediately followed by a letter — this catches
      # ALL YAML type-tag variants: !!python/, !!ruby/, !!perl/, !!binary,
      # !!map, !!str, etc.  YAML tags always begin with a letter after !!.
      # It does NOT match "!!!" (emphasis punctuation present in agent files
      # like gojo:170, nobara:136, panda:212/239/257, sukuna:32, todo:259,
      # yuuji:298/304/312/323 — "Must be followed verbatim!!!").
      # This replaces "!!\\S" which false-positived on !!! (WI-CR-5 CodeRabbit #5).
      - "!![a-zA-Z]"    # YAML deserialization tags (!! followed by a letter)

    # Required fields in agent YAML
    required_fields:
      - "name"
      - "description"
      - "tools"
      - "model"

    # Validate agent name format
    name_pattern: "^custom-[a-z][a-z0-9-]{2,20}$"

  # Monitoring (CUST-CRIT-006)
  # Gojo tracks all custom agent activity
  monitoring:
    enabled: true

    # Custom agent registry file
    registry_file: ".protocol-state/custom-agent-registry.json"

    # Audit log for custom agent actions
    audit_log: ".protocol-state/authorization/custom-agent-audit.log"

    # Include custom agents in Trigger 19 reports
    include_in_trigger19: true

    # Track actual tool usage vs declared permissions
    track_tool_usage: true

    # Monitor for suspicious patterns
    detect_anomalies: true

  # Code Signing (CUST-CRIT-007)
  # Verifies integrity of core/extended agents
  code_signing:
    # Verify core agents have valid signatures
    verify_core_agents: true

    # Verify extended agents have valid signatures
    verify_extended_agents: true

    # Warn when loading unsigned custom agents
    warn_unsigned_custom: true

    # Public key repository for signature verification
    public_key_url: "https://github.com/DewyHRite/Domain-Zero-Protocol/keys/"

    # Block loading if signature verification fails
    block_on_signature_failure: true

  # Rate Limiting (CUST-HIGH-001)
  # Prevents resource exhaustion via excessive invocations
  rate_limiting:
    enabled: true

    # Maximum invocations per minute per agent
    max_invocations_per_minute: 10

    # Maximum concurrent custom agents
    max_concurrent_custom_agents: 2

    # Cooldown period between invocations (seconds)
    cooldown_period_seconds: 5

  # Output Sanitization (CUST-HIGH-002)
  # Detects dangerous commands in agent output
  output_sanitization:
    enabled: true

    # Detect dangerous shell commands in output
    detect_dangerous_commands: true

    # Warn user about suspicious output
    warn_on_suspicious_output: true

    # Dangerous patterns to detect
    dangerous_patterns:
      - "curl\\s+\\S+\\s*\\|\\s*bash"   # Pipe to bash
      - "wget\\s+\\S+\\s*\\|\\s*sh"     # Pipe to shell
      - "rm\\s+-rf\\s+/"                # Destructive rm
      - "chmod\\s+777"                  # Dangerous permissions
      - "eval\\s*\\("                   # Eval injection

  # Handoff Security (CUST-CRIT-005)
  # Sanitizes context passed between agents
  handoff_security:
    # Sanitize handoff context
    sanitize_context: true

    # Validate context fields against whitelist
    validate_context_fields: true

    # Reserved triggers for core agents
    reserved_triggers:
      - "@security-review"
      - "@user-review"
      - "@approved"
      - "@remediation-required"
      - "@re-review"
      - "@escalate"
      - "@brief-implementation"
      - "@brief-security"
      - "@brief-design"

    # Detect infinite handoff loops
    detect_handoff_loops: true

    # Maximum handoff chain length
    max_handoff_chain_length: 5

  # Quarantine System (CUST-MED-007)
  # Automatically quarantine suspicious agents
  quarantine:
    enabled: true

    # Quarantine directory
    quarantine_dir: ".protocol-state/quarantine/"

    # Auto-quarantine on validation failure
    auto_quarantine: true

    # Require manual review to restore from quarantine
    require_manual_review: true

# ============================================================================
# PROTECTED DOCUMENTS (FEAT-GUARD-001, v9.4.1)
# ============================================================================
# Configures the append-only enforcement guard for permanent project memory files.
# check_protected_append_only.py reads this block at pre-commit time.
#
# enabled:      false = guard is a no-op (exit 0). A skip message is printed to
#               stderr so the bypass is always visible. Default: true.
# paths:        List of repo-root-relative paths that must only grow (append-only).
#               Relative forward-slash paths, no trailing slash for files.
# override_env: Environment variable name that allows a legit rewrite when set to "1"
#               (e.g. file rotation / authorized restore).  Default: DZP_ALLOW_PROTECTED_REWRITE.
#
# If this block is absent, malformed, or yaml is unavailable the guard falls back
# to the hardcoded constant list in check_protected_append_only.py — never fail-open.

protected_documents:
  enabled: true
  paths:
    - .protocol-state/dev-notes.md
    - .protocol-state/security-review.md
    - .dzp-domain/domain.record.md
    # FEAT-IDGOV-001 (E7): defense-in-depth. The issue-registry has its own
    # dedicated LINE-WISE append-only + content-invariant gate
    # (scripts/check_issue_ids.py), but adding it here too means the
    # byte-prefix guard below also refuses a mid-file rewrite of the
    # registry, independent of that gate.
    - .protocol-state/issue-registry.jsonl
  override_env: DZP_ALLOW_PROTECTED_REWRITE

# ============================================================================
# ISSUE-ID GOVERNANCE (FEAT-IDGOV-001, v9.10.0)
# ============================================================================
# Configures scripts/check_issue_ids.py, the fail-closed enforcement gate for
# the append-only issue-id registry (.protocol-state/issue-registry.jsonl).
#
# enabled:               false = gate is a no-op (exit 0). A loud skip
#                         message is always printed to stderr. Default: true.
# registry_path:          repo-root-relative path to the JSONL registry.
# families:               the recognized issue-id family enum. Documentation
#                         + a startup drift assertion ONLY -- id recognition
#                         is always governed by the engine
#                         (scripts/idgov/grammar.py FAMILIES), never by this
#                         config value; a mismatch here only produces a
#                         stderr warning, it never changes gate behavior.
# corpus_paths:           prose files scanned for id citations (mint-before-
#                         cite / malformed-id checks, E4/E5).
# escape_path_excludes:   corpus paths exempted from citation scanning
#                         entirely (glob or literal match).
# id_term_allowlist:      exact-match (case-insensitive) id-shaped tokens to
#                         exempt from the malformed-id block (E5 only), e.g.
#                         rare WITH-digit generic terms the E5 digit-gate
#                         (a token must contain a digit to be flagged
#                         malformed -- see check_issue_ids.py::_has_seq_digit)
#                         wouldn't catch on its own. Default: [] (empty --
#                         the digit-gate is the workhorse fix; this is an
#                         escape hatch for exceptions found in practice).
# override_env:           environment variable name that allows an
#                         authorized exception when set to "1" (backfill /
#                         migration / restore). Default: DZP_ALLOW_ISSUE_ID_OVERRIDE.
# toji_self_reference_exemption: (ISS-IDGOV-9.10.1-001, v9.10.2) E5-only
#                         kill-switch for the audits/** per-file,
#                         per-declaration self-reference exemption -- a bare
#                         id-shaped token (e.g. SEC-001) is exempt from the
#                         malformed-id block ONLY if that SAME audits/** file
#                         independently declares it in a structurally-complete
#                         Toji SECTION B finding block (reuses
#                         check_toji_report_contract.py's real per-finding
#                         validation; SEC-IDGOV-D-001). Case-insensitive
#                         match; strictly per-file (a bare id declared only in
#                         report A still blocks when cited bare in report B).
#                         Never touches E4 (mint-before-cite) or
#                         grammar.is_wellformed()'s classification of real
#                         ids. Default: true. Set to false to revert E5 to
#                         its pre-v9.10.2 behavior exactly (no exemption).
#
# If this block is absent, malformed, or yaml is unavailable, the gate falls
# back to the hardcoded module constants in check_issue_ids.py -- fail-SAFE,
# never fail-open (a config problem NEVER silently disables enforcement; only
# an explicit, readable `enabled: false` does).

issue_governance:
  # CURRENT LIFECYCLE STATEMENT (Toji CODE-001 remediation, 2026-07-18 --
  # supersedes the two contradictory "inert pending go-live" / "activated"
  # comments this replaced; that superseded text is preserved below purely as
  # historical release-note context, NOT as an instruction).
  #
  # DEV POSTURE (this file, as committed to the dev tree): enabled: true.
  # Activated 2026-07-18 -- real corpus backfilled (1229 legacy rows),
  # FEAT-IDGOV-001 minted as the first live record, gate wired into the
  # reinstalled pre-commit hook. Enforcement is live on every dev-repo commit.
  # When false, scripts/check_issue_ids.py no-ops with a loud stderr notice and
  # exits 0 on every invocation (hook stage 6 and the CI job both call it
  # unconditionally; this flag is what actually gates behavior, not the
  # callers).
  #
  # DISTRIBUTION POSTURE (the copy shipped to consumers): FORCED to false by
  # the fail-closed issue_governance_scrub_file neutralizer
  # (scrub_issue_governance() in scripts/distro/dzp_publish_core.py, wired via
  # scripts/distro/publish-manifest.yaml), regardless of this file's dev-tree
  # value. This closes Toji UX-001 (2026-07-18): a fresh consumer install ships
  # no backfilled registry and no .idgov-tokens/ signing secrets, so shipping
  # enabled: true here would trip the fail-closed gate on the very first
  # protected-record/audit commit a consumer makes. Consumers explicitly opt in
  # via the documented activation flow -- see AI_INSTRUCTIONS.md /
  # PROTOCOL_QUICKSTART.md "Issue-ID Governance" sections.
  #
  # HISTORICAL (superseded -- kept only for release-note continuity, describes
  # the pre-2026-07-18 Phase G "installed but inert" design where this file's
  # OWN value, not a publish-time scrub, was the only enforcement toggle):
  # "INERT pending a separate, deliberate, USER-gated go-live (Phase G is
  # 'installed but inert' by design: hook stage + CI job + manifest are wired
  # up, but enforcement itself stays off until explicitly flipped). Flip to
  # true only as its own reviewed, deliberate change."
  enabled: false
  registry_path: .protocol-state/issue-registry.jsonl
  # P7 (USER 2026-07-18): design-domain findings (e.g. Toji UI/UX + System
  # Design audit categories) map to the EXISTING CODE (design-quality) /
  # IMPL (impl-integrity) families rather than adding a new DESIGN family --
  # deferred until volume actually justifies an additive grammar change.
  # This list MUST equal sorted(scripts/idgov/grammar.py FAMILIES); the
  # engine, not this config, is authoritative -- see the drift-warning note
  # above.
  # FEAT-IDGOV-003 (v9.11.0 Increment 4, USER decision D1 2026-07-28):
  # LL (Lessons Learned -- Gojo) and SF (Security Framework -- Megumi) added
  # as first-class families (engine.AUTHORITY: LL->gojo, SF->megumi).
  families: [SEC, BUG, FEAT, IMPL, CODE, ISS, TEST, MF, LL, SF]
  corpus_paths:
    - .protocol-state/dev-notes.md
    - .protocol-state/security-review.md
    - .dzp-domain/domain.record.md
    # SEC-IDGOV-E-002 (USER decision 2026-07-17): Toji audit reports are a
    # citation surface too. Glob entries (matched with fnmatch against the
    # CHANGED files in the diff range, not enumerated on disk) are supported
    # alongside exact paths -- see check_issue_ids._resolve_corpus_targets().
    # Sequencing note: this gate does not become part of the commit/CI path
    # until Phase G1 wires it into the pre-commit hook + CI, which per plan
    # runs AFTER Phase F's non-destructive backfill populates the registry
    # from history -- so by the time audits/** enforcement is actually LIVE,
    # historical audit citations already have legacy registry rows. It is
    # therefore safe to list audits/** here now, ahead of Phase G1, even
    # while the registry itself is still sparse.
    - audits/**
  escape_path_excludes:
    - docs/superpowers/specs/**
    - docs/superpowers/plans/**
    - CLAUDE.md
    - protocol/CLAUDE.md
  # Go-live prep (real-corpus dry-run finding, 2026-07-18): E5's digit-gate
  # (check_issue_ids.py::_has_seq_digit -- a token must contain a digit to be
  # flagged malformed) already exempts digitless generic terms like SEC-ID/
  # SEC-NNN/SEC-GRAPH on its own. This allowlist is empty by default; use it
  # only for a rare WITH-digit generic term (e.g. a severity notation like
  # SEC-P0) the digit-gate itself would not catch.
  id_term_allowlist: []
  override_env: DZP_ALLOW_ISSUE_ID_OVERRIDE
  # ISS-IDGOV-9.10.1-001 (v9.10.2, SEC-IDGOV-D-001..D-005, Sukuna Rev 2
  # design audits/2026-07-20-sukuna-iss-idgov-9-10-1-001-design.md, Megumi
  # Tier-3 @approved twice): USER-ruled default ENABLED. Set to `false` for
  # an instant, no-code-revert rollback to pre-v9.10.2 E5 behavior (no
  # audits/** self-reference exemption at all).
  toji_self_reference_exemption: true

# ============================================================================
# VERSIONING
# ============================================================================
versioning:
  protocol_version: "9.12.1"
  config_version: "2.11"
  last_updated: "2026-08-08"
  changelog: "protocol/GOJO-UPDATES-PATCH.md"

# ============================================================================
# CUSTOM TRIGGERS
# ============================================================================
custom_triggers:
  max_triggers: 10
  case_sensitive: false
  auto_suggest: true

  # Default triggers
  triggers:
    - id: "19"
      function: "Trigger 19"
      description: "Full Intelligence Report"
      is_default: true

    - id: "protect"
      function: "CLAUDE.md Protection Status"
      description: "Check protocol file integrity"
      is_default: true

