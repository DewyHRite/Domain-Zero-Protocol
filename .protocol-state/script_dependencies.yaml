version: 1
defaults:
  timeout_seconds: 30
  fail_soft: true

events:
  session-update:
    description: Refresh session, Cortex, custom-agent, and tier status after work.
    fail_soft: true
    steps:
      - name: session-update
        command: ["python", ".protocol-state/session_monitor.py", "update"]
        env:
          DZP_AGENT: "gojo"
        timeout_seconds: 60
        required: true
      - name: cortex-medium
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "medium", "--reason", "session-update", "--repo", "."]
        # BUG-CORTEX-008 R5 (2026-07-18, Sukuna, canonical port of a downstream-verified
        # durable fix): detach: true launches this step fully off the coordinator's
        # critical path (fire-and-forget via ScriptCoordinator._spawn_detached) so
        # it returns "launched" immediately instead of blocking on a timeout. Root
        # cause (see internal-docs/Patch Report/Bug Report/
        # BUG-CORTEX-008-sessionend-high-rebuild-timeout-2026-07-13.md §11):
        # Cortex re-index cost is embedding-DELTA-bound, not corpus-size-bound, so
        # the one run immediately after a heavy session's largest content delta
        # chronically starved even a raised timeout, independent of --level (R3's
        # premise -- that switching to --level medium alone would fix it -- was
        # disproven by this same class of timeout recurring on medium). Detaching
        # removes the step from the critical path entirely rather than racing a
        # bigger budget. Single-flight safety is unchanged: Cortex's own
        # index.lock already serializes concurrent index runs. timeout_seconds
        # below is now a detach-DISABLED FALLBACK ONLY -- consulted solely if
        # `detach` is ever removed/set false; it is not exercised while detach
        # is active.
        detach: true
        timeout_seconds: 90
        required: false
      - name: custom-agent-list
        command: ["python", ".protocol-state/custom_agent_monitor.py", "--list"]
        timeout_seconds: 30
        required: false
      - name: tier-status
        command: ["python", ".protocol-state/tier-enforcement.py", "--status"]
        timeout_seconds: 30
        required: false
      - name: tier-statistics
        command: ["python", ".protocol-state/tier-statistics.py", "--view"]
        timeout_seconds: 30
        required: false

  session-end:
    description: Flush session state, snapshot, and export Cortex memory.
    fail_soft: true
    steps:
      - name: session-end
        command: ["python", ".protocol-state/session_monitor.py", "end"]
        env:
          DZP_AGENT: "gojo"
        timeout_seconds: 60
        required: true
      - name: end-snapshot
        command: ["python", ".protocol-state/create-snapshot.py", "--auto", "--tier", "2", "--trigger", "session-end"]
        timeout_seconds: 120
        required: false
      - name: cortex-medium
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "medium", "--reason", "session-end", "--repo", "."]
        # BUG-CORTEX-008 R3 (2026-07-13, durable fix, supersedes the R1 180->300s
        # stopgap): session-end now runs an INCREMENTAL (--level medium) re-index
        # instead of a synchronous full (--level high --export) rebuild. Root cause
        # (see internal-docs/Patch Report/Bug Report/
        # BUG-CORTEX-008-sessionend-high-rebuild-timeout-2026-07-13.md §8): the full
        # rebuild's cost is embedding-DELTA-bound, not corpus-size-bound, and
        # session-end fires it immediately after the session's own largest content
        # delta — the single worst moment to run it synchronously. Moving the full
        # rebuild off this critical path removes the race entirely rather than just
        # buying headroom. 90s matches the timeout used for --level medium elsewhere
        # in this file (session-update, ts-complete).
        # The full --level high + --export rebuild now lives in the standalone
        # 'cortex-rebuild-full' event below — run manually/periodically via
        # `python dzp.py event cortex-rebuild-full` (DZP is no-daemon; no automated
        # scheduler exists or is proposed). See report §10 for the full design +
        # accepted trade-off (export snapshot freshness now depends on that event
        # being run, not on session-end).
        #
        # BUG-CORTEX-008 R5 (2026-07-18, Sukuna, canonical port of a downstream-verified
        # durable fix — supersedes R3's premise, does NOT replace R3's rename):
        # R3's rename to --level medium alone was later disproven as a full fix —
        # a downstream install's `session-update.cortex-medium` (same --level medium)
        # ALSO timed out at its 90s cap, showing the defect is a fixed timeout on
        # a variable-length embed, independent of level (see report §11.1).
        # detach: true now launches this step fully off the coordinator's critical
        # path (fire-and-forget via ScriptCoordinator._spawn_detached), returning
        # "launched" immediately. Single-flight safety is unchanged: Cortex's own
        # index.lock already serializes concurrent index runs. timeout_seconds
        # below is now a detach-DISABLED FALLBACK ONLY — consulted solely if
        # `detach` is ever removed/set false.
        detach: true
        timeout_seconds: 90
        required: false
      - name: cortex-distill
        # WI-19 (v9.6.0): Advisory memory distillation step at session end.
        # Proposes 3-5 typed memories from recent activity (8h window).
        # NEVER auto-writes — user must run 'brain remember' to persist any proposal.
        # Runs after cortex-high and end-snapshot so it sees the latest indexed state.
        command: ["python", ".protocol-state/brain/brain.py", "distill", "--window", "8", "--max", "5"]
        timeout_seconds: 60
        required: false
      - name: validation-refresh
        # IMPL-001 (Toji audit 2026-07-20, audits/2026-07-20-toji-recent-work-audit.md):
        # session-end's own steps mutate project-state.json (session-end),
        # snapshot-manifest.json + a new snapshot (end-snapshot), and the protected
        # records (session-end), but validation-state.json's last_full_validation /
        # last_validation_result previously described only the state BEFORE those
        # mutations — a consumer reading last_validation_result alone could mistake
        # a dirty post-mutation state for a validated one (NIST SP 800-53 SI-7).
        # Fix: re-run the SAME read+recompute+persist check used by ts-complete/
        # pre-release as the FINAL step of session-end, so the ledger's checksums
        # and last_full_validation timestamp reflect the true terminal state.
        # Placement: last step in this event. session-end and end-snapshot are the
        # only steps that mutate files covered by validate-protocol.py's schema/
        # checksum set; cortex-medium is detached (fire-and-forget, touches only the
        # Cortex DB) and cortex-distill only proposes (never auto-writes) memories,
        # so neither touches validated state — but ordering last removes any doubt
        # and stays correct if a future step is added.
        # Fail-soft (required: false): a validation failure/exception here must
        # never block session-end; the ledger simply records the honest result
        # (including "failed", which is itself the intended fix for the finding —
        # an honest failed/stale status is strictly better than a silently stale
        # "passed").
        #
        # IMPL-001 CORRECTION (Toji audit 2026-07-30, MEDIUM): the paragraph
        # above ("validate-protocol.py --check only writes to validation-state.json
        # itself... this step cannot retrigger the mutation-then-stale-ledger
        # cycle") was TRUE about validate-protocol.py but incomplete: it did not
        # account for script_coordinator.py's OWN post-step bookkeeping write.
        # `run_event()` calls `self._record_result(result)` AFTER every configured
        # step finishes — including this one — and that call mutates + saves
        # project-state.json (appending this event's script_orchestration
        # summary). Being the LAST configured STEP therefore did not make this
        # the last project-state.json mutation: the coordinator's own bookkeeping
        # save ran after it every time, immediately invalidating the checksum/
        # sequence this step had just recorded. `terminal_validator: true` below
        # is the fix — script_coordinator.py's run_event() excludes a step so
        # flagged from the main step loop and instead runs it AFTER
        # _record_result() has persisted the event's own outcome, so it measures
        # the TRUE terminal project-state.json. See
        # tests/test_coordinator_registry.py::TestIMPL001TerminalValidatorOrdering
        # for the reproduction + fix proof.
        command: ["python", "scripts/validate-protocol.py", "--check", "--ci-mode"]
        timeout_seconds: 60
        required: false
        terminal_validator: true

  session-transfer:
    # FEAT-TRANSFER-9.11.0-001 (v9.11.0 Increment 2): update + end + a durable
    # handoff brief, so the next session starts warm instead of losing the
    # "why" behind the state files. See
    # internal-docs/Patch Report/DZP-MASTER-PLAN-2026-07-28.md Workstream B
    # and protocol/skills/session.md § /session transfer for the full design.
    #
    # fail_soft: false (EVENT-LEVEL) IS THE LOAD-BEARING LINE (M1). Per Toji
    # DESIGN-001 (2026-07-27): `required: true` on a step only sets a failure
    # flag -- it does NOT stop the loop (see script_coordinator.py's
    # run_event(): `if fail_closed: break` is the ONLY thing that breaks it,
    # and `fail_closed = strict or not event_fail_soft`). Without this
    # event-level flag, a failed session-end (step 2) would still be followed
    # by handoff-write (step 3), which -- reading session_history[-1] -- would
    # durably record the PREVIOUS session as the one just ended. Invoke with
    # --strict as belt-and-braces (M1 is already sufficient on its own).
    #
    # IMPL-001 + DESIGN-001 remediation (Toji audit 2026-07-29): two changes
    # from the first live run's post-mortem:
    #   1. `transfer-finalize` (new step, required: true) runs immediately
    #      after end-snapshot and is the ONLY thing that clears the durable
    #      .INCOMPLETE marker now -- handoff-write no longer clears it
    #      directly (see session_monitor.py's handoff_write()/
    #      transfer_finalize()). If end-snapshot fails, this event is
    #      fail-closed (see above) so transfer-finalize never runs and the
    #      marker correctly survives with only 'handoff-write' recorded --
    #      closing the exact gap IMPL-001 identified (marker cleared before
    #      the mandatory snapshot actually completed).
    #   2. cortex-medium/cortex-distill/validation-refresh now additionally
    #      carry `non_blocking: true` (script_coordinator.py's run_event()) so
    #      their failure can never break this fail-closed event or flip an
    #      otherwise-complete transfer to `failure` -- closing DESIGN-001
    #      without loosening the fail-closed guarantee for the required
    #      prefix (transfer-begin..transfer-finalize) at all.
    description: >-
      Fail-closed state machine: transfer-begin marker -> full session-update
      sync -> session-end (archives current session) -> handoff-write (brief +
      archive copy, identity-checked against session_history[-1]) ->
      end-snapshot (mandatory terminal state capture) -> transfer-finalize
      (clears the marker only once every required step above has completed)
      -> non_blocking Cortex/validation refresh tail (advisory; cannot fail
      or block this event).
    fail_soft: false
    steps:
      - name: transfer-begin
        # M3: writes .protocol-state/session-handoff.INCOMPLETE with the
        # CURRENTLY active session's id, captured BEFORE session-end (below)
        # archives and resets it. This is how the expected id survives to
        # step 3's identity check despite the coordinator having no mechanism
        # to pass a value from one step's output into a later step's command.
        command: ["python", ".protocol-state/session_monitor.py", "transfer-begin"]
        timeout_seconds: 30
        required: true
      - name: session-update
        # Full sync: project documents + secret scan + backups (same command
        # as the session-update event's own first step). Runs the document
        # sync BEFORE session-end so the pre-transfer state is captured too.
        command: ["python", ".protocol-state/session_monitor.py", "update"]
        env:
          DZP_AGENT: "gojo"
        timeout_seconds: 60
        required: true
      - name: session-end
        # Archives session_history[-1] -- the exact record handoff-write
        # (below) will read and identity-check against.
        command: ["python", ".protocol-state/session_monitor.py", "end"]
        env:
          DZP_AGENT: "gojo"
        timeout_seconds: 60
        required: true
      - name: handoff-write
        # M2: no --expect-session-id is passed here (the coordinator cannot
        # inject transfer-begin's captured id into this static command list).
        # handoff_write() falls back to reading the expected id from the
        # .INCOMPLETE marker transfer-begin just wrote, asserts it against
        # session_history[-1], writes session-handoff.md + the archive copy
        # ONLY on a match, and clears the marker. Refuses to write (non-zero
        # exit) on any mismatch or if the marker is missing entirely.
        command: ["python", ".protocol-state/session_monitor.py", "handoff"]
        timeout_seconds: 30
        required: true
      - name: end-snapshot
        # ISS-TRANSFER-9.11.0-001 (2026-07-29, USER directive): mandatory, not
        # optional. Two reasons: (1) the end-of-transfer snapshot is the
        # durable, complete state capture Toji reads for post-session audit
        # (.protocol-state/snapshots/ -- standing read access, no CLI needed);
        # a transfer that silently skipped it would leave that audit trail
        # incomplete with no visible signal. (2) it was the trigger value
        # --trigger session-transfer that was rejected by create-snapshot.py's
        # argparse choices on the first live run (fixed in the same change,
        # see VALID_TRIGGERS in .protocol-state/create-snapshot.py) -- required:
        # true ensures that class of failure is never silently swallowed again.
        #
        # SEC-TRANSFER-9.11.0-007 (P3, informational, Megumi 2026-07-29)
        # MECHANISM CORRECTION -- the previous version of this comment claimed
        # required: true is what breaks the loop before the optional
        # cortex-medium/cortex-distill/validation-refresh tail below. That was
        # WRONG. Per script_coordinator.py's run_event() (~lines 164-183):
        #     fail_closed = strict or not event_fail_soft
        #     if failed and (fail_closed or required): success = False
        #     if fail_closed: break        # <-- gates the break; `required` is
        #                                  #     NEVER consulted here
        # The break is gated on this EVENT's `fail_soft: false` (fail_closed)
        # ALONE -- it happens for ANY failing step, required or not. `required:
        # true` here only affects whether a non-breaking failure marks the
        # overall event `success: False`, which matters only if this event's
        # `fail_soft` were ever flipped to `true`. It is defensive
        # future-proofing, not what currently causes the break. Proven with
        # two identical scenarios (required: true and required: false) in
        # tests/test_session_transfer.py::TestFinding_EndSnapshotRequiredBreaksBeforeCortexTail.
        # Whether the fail-closed cortex-tail-skipping behavior ITSELF is
        # correct is a SEPARATE, OPEN question tracked under
        # ISS-TRANSFER-9.11.0-001 for Sukuna's coordinator-semantics call
        # (step-level fail_soft) -- NOT changed in this batch.
        command: ["python", ".protocol-state/create-snapshot.py", "--auto", "--tier", "2", "--trigger", "session-transfer"]
        timeout_seconds: 120
        required: true
      - name: transfer-finalize
        # IMPL-001 remediation (Toji audit 2026-07-29): the FINAL required
        # step. Only runs if end-snapshot (above) succeeded -- this event is
        # fail-closed, so a failing end-snapshot breaks the loop before this
        # step is ever reached, leaving the .INCOMPLETE marker in place with
        # only 'handoff-write' recorded (see session_monitor.py's
        # transfer_finalize()/_mark_transfer_step_complete()). Marks
        # 'end-snapshot' complete in the marker and clears the marker only
        # once every step in _TRANSFER_REQUIRED_STEPS is recorded --
        # completing the durable state machine handoff-write alone used to
        # (incorrectly) finish on its own.
        command: ["python", ".protocol-state/session_monitor.py", "transfer-finalize"]
        timeout_seconds: 30
        required: true
      - name: cortex-medium
        # Indexes the handoff brief itself for next-session recall. Detached
        # (BUG-CORTEX-008 R5 precedent) -- fire-and-forget, off the critical path.
        # non_blocking (DESIGN-001, 2026-07-29): failure here must never break
        # this fail-closed event or flip a completed transfer to `failure`.
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "medium", "--reason", "session-transfer", "--repo", "."]
        detach: true
        timeout_seconds: 90
        required: false
        non_blocking: true
      - name: cortex-distill
        # Propose-only (never auto-writes); mirrors session-end's cortex-distill step.
        # non_blocking (DESIGN-001, 2026-07-29): see cortex-medium above.
        command: ["python", ".protocol-state/brain/brain.py", "distill", "--window", "8", "--max", "5"]
        timeout_seconds: 60
        required: false
        non_blocking: true
      - name: validation-refresh
        # Last, per IMPL-001 (v9.10.2) -- refreshes the validation ledger
        # AFTER this event's own state mutations (session-update, session-end,
        # end-snapshot) so it describes the true terminal state.
        # non_blocking (DESIGN-001, 2026-07-29): see cortex-medium above.
        #
        # terminal_validator: true (IMPL-001, Toji audit 2026-07-30, MEDIUM):
        # being the last configured STEP was not sufficient -- the coordinator's
        # own post-loop _record_result() write is ALWAYS the true last
        # project-state.json mutation of any event, so it superseded whatever
        # this step had just measured, every single run (proven live: validation
        # recorded seq 87 / feb4d939..., the coordinator's own write then
        # advanced project-state.json to seq 88 / 1d928296... while this step
        # still reported "passed"). `terminal_validator: true` moves this step's
        # EXECUTION to after _record_result() (see script_coordinator.py's
        # run_event()) without changing its fail-soft/non_blocking posture --
        # a failure here still only WARNs and can never fail this event.
        command: ["python", "scripts/validate-protocol.py", "--check", "--ci-mode"]
        timeout_seconds: 60
        required: false
        non_blocking: true
        terminal_validator: true

  ts-start:
    description: Pre-troubleshooting context checks.
    fail_soft: true
    steps:
      - name: session-status
        command: ["python", ".protocol-state/session_monitor.py", "status"]
        timeout_seconds: 30
        required: false
      - name: dependency-scan
        command: ["python", "scripts/dependency-scanner.py", "--scan"]
        timeout_seconds: 60
        required: false
      - name: cortex-low
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "low", "--reason", "ts-start", "--repo", "."]
        timeout_seconds: 30
        required: false

  ts-complete:
    description: Post-troubleshooting refresh for Cortex and tier statistics.
    fail_soft: true
    steps:
      - name: cortex-medium
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "medium", "--reason", "ts-complete", "--repo", "."]
        timeout_seconds: 90
        required: false
      - name: tier-statistics
        command: ["python", ".protocol-state/tier-statistics.py", "--view"]
        timeout_seconds: 30
        required: false
      - name: validation-check
        # IMPL-001 (Toji audit 2026-07-30, MEDIUM): must be this event's
        # terminal_validator, not merely its last configured step -- the
        # coordinator's own post-loop _record_result() write is ALWAYS the
        # true last project-state.json mutation, so a step meant to describe
        # the terminal state must run AFTER that write (see run_event() /
        # the equivalent session-end validation-refresh comment above for
        # the full rationale).
        command: ["python", "scripts/validate-protocol.py", "--check", "--ci-mode"]
        timeout_seconds: 60
        required: false
        terminal_validator: true

  pre-protected-edit:
    description: Fail-closed gate before protected document edits.
    fail_soft: false
    steps:
      - name: cortex-recall
        # WI-17 (v9.6.0): Proactive recall — surface relevant prior decisions/sec findings
        # before editing a protected document. Advisory step (S-RISK-001/G-RISK-004 ruling).
        # timeout_seconds: 30 is appropriate for cached recall; first model download may need 120s.
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--recall", "--context", "protected document edit context", "--trust", "trusted,semi", "--repo", "."]
        timeout_seconds: 30
        required: false
      - name: cortex-pre-edit
        # S-RISK-001 USER DECISION 2026-06-16: required: false (fail-soft advisory).
        # No --strict flag. Cortex failure does NOT block the protected edit.
        # Promotion to required: true deferred until Cortex reliability is confirmed
        # in the 4-install shared-brain environment.
        # HIGH level includes rotation-check advisory step — warns if docs are near threshold.
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "high", "--reason", "pre-protected-edit", "--repo", "."]
        timeout_seconds: 120
        required: false
      - name: protected-edit-snapshot
        command: ["python", ".protocol-state/create-snapshot.py", "--auto", "--tier", "3", "--trigger", "pre-protected-edit"]
        timeout_seconds: 120
        required: true
      - name: dependency-impact
        command: ["python", "scripts/dependency-scanner.py", "--analyze", ".protocol-state/project-state.json"]
        timeout_seconds: 60
        required: true
      - name: protocol-preview
        command: ["python", "scripts/validate-protocol.py", "--fix", "--preview", "--ci-mode"]
        timeout_seconds: 60
        required: true

  pre-release:
    description: Fail-closed release preflight across validation, agents, version, and Cortex.
    fail_soft: false
    steps:
      - name: validate-protocol
        command: ["python", "scripts/validate-protocol.py", "--check", "--ci-mode"]
        timeout_seconds: 90
        required: true
      - name: verify-auto-invoked
        command: ["python", "scripts/verify-auto-invoked.py"]
        timeout_seconds: 60
        required: true
      - name: validate-custom-agents
        command: ["python", "scripts/validate-custom-agents.py", "--validate-all"]
        timeout_seconds: 60
        required: true
      - name: assert-version
        command: ["python", "scripts/distro/assert_version.py", "--root", "."]
        timeout_seconds: 60
        required: true
      - name: check-version-stamps
        # v9.7.2: full-repo stamp linter — catches CORE FILE headers, bold footers, and
        # protocol_version frontmatter that assert_version (20-file gate) cannot see.
        # This is the durable fix for the large stamp-drift found at v9.7.2.
        command: ["python", "scripts/distro/check_version_stamps.py", "--root", "."]
        timeout_seconds: 120
        required: true
      - name: check-sukuna-report-currency
        # v9.12.1 (IMPL-SUKUNAGATE-9.12.1-001): mechanical enforcement of SUKUNA-REPORT.md's own
        # accumulation-policy rule 2 (protocol/SUKUNA-REPORT.md, rule 4's
        # disclosed gap) — fails closed if CHANGELOG.md gains a #### Fixed /
        # #### Security section for the current version with no matching
        # SUKUNA-REPORT.md "## vX.Y.Z ..." header. Closes the exact
        # silent-skip failure that recurred for 8 consecutive releases
        # (v9.9.5 -> v9.12.0) before this policy existed.
        command: ["python", "scripts/distro/check_sukuna_report_currency.py", "--root", "."]
        timeout_seconds: 30
        required: true
      - name: cortex-high
        # HIGH-002: full high trigger, fail-CLOSED (--strict). Cortex health is a release gate.
        # BUG-CORTEX-008 (2026-07-13, Sukuna R1 stopgap): timeout raised 180->300s.
        # Cause is embedding-DELTA-bound, not corpus-size-bound — see the
        # cortex-rebuild-full event below for the full rationale (R3, the durable
        # fix that moved the equivalent full-rebuild step off the session-end
        # critical path) and internal-docs/Patch Report/Bug Report/
        # BUG-CORTEX-008-...-2026-07-13.md §8/§10.
        # required: true here means this step is fail-CLOSED, unlike session-end/
        # cortex-rebuild-full; a starved timeout blocks the release preflight, so
        # headroom matters more — this event is infrequent and synchronous-by-design.
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "high", "--reason", "pre-release", "--strict", "--repo", "."]
        timeout_seconds: 300
        required: true
      - name: tier-statistics
        command: ["python", ".protocol-state/tier-statistics.py", "--view"]
        timeout_seconds: 30
        required: true
      - name: gnogo-check
        # WI-18 (v9.6.0): Advisory go/no-go entity-graph check before release.
        # required: false initially — advisory until the entity graph is populated with
        # real WI/SEC entities. Promotes to required: true in a follow-on patch.
        command: ["python", ".protocol-state/brain/brain.py", "gnogo", "--release", "pre-release", "--trust", "trusted,semi"]
        timeout_seconds: 60
        required: false

  toji-snapshot:
    description: Snapshot-only Toji audit event; no interactive CLI execution.
    fail_soft: true
    steps:
      - name: toji-snapshot
        command: ["python", ".protocol-state/create-snapshot.py", "--auto", "--tier", "2", "--trigger", "toji-snapshot"]
        timeout_seconds: 120
        required: true
      - name: cortex-export-for-toji
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "medium", "--reason", "toji-snapshot", "--export", "--repo", "."]
        timeout_seconds: 90
        required: false

  pre-publish:
    description: Fail-closed gate before DZP distro publish. Runs cortex-high (--strict) + assert_version (--root . resolves to the repo root, the coordinator's cwd) [SEC-C1-002] + check_version_stamps (full-repo stamp linter, v9.7.2). Agent-file/protocol validation is intentionally NOT duplicated here [SEC-C1-003] — it is handled by the dzp-publish scrub/audit pipeline; this is the designed difference vs pre-release.
    fail_soft: false
    steps:
      - name: cortex-high
        # BUG-CORTEX-008 (2026-07-13, Sukuna R1 stopgap): timeout raised 180->300s.
        # Embedding-DELTA-bound, not corpus-size-bound; see the cortex-rebuild-full
        # event below (R3 durable fix) + internal-docs/Patch Report/Bug Report/
        # BUG-CORTEX-008-...-2026-07-13.md §8/§10.
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "high", "--reason", "pre-publish", "--strict", "--repo", "."]
        timeout_seconds: 300
        required: true
      - name: assert-version
        command: ["python", "scripts/distro/assert_version.py", "--root", "."]
        timeout_seconds: 60
        required: true
      - name: check-version-stamps
        # v9.7.2: full-repo stamp linter — catches all 3 stamp types across the whole repo.
        # Keeps drifted stamps from shipping in the public distro.
        command: ["python", "scripts/distro/check_version_stamps.py", "--root", "."]
        timeout_seconds: 120
        required: true
      - name: check-sukuna-report-currency
        # v9.12.1 (IMPL-SUKUNAGATE-9.12.1-001): same rule-2 accumulation-policy gate as pre-release (see
        # that event's step for the full rationale) — repeated here, not
        # merely relied upon transitively, so a publish invoked without a
        # preceding pre-release run still cannot ship a missed entry.
        command: ["python", "scripts/distro/check_sukuna_report_currency.py", "--root", "."]
        timeout_seconds: 30
        required: true

  post-migration:
    description: Post-migration Cortex refresh (fail-soft).
    fail_soft: true
    steps:
      - name: cortex-high
        # BUG-CORTEX-008 (2026-07-13, Sukuna R1 stopgap): timeout raised 180->300s.
        # Embedding-DELTA-bound, not corpus-size-bound; see the cortex-rebuild-full
        # event below (R3 durable fix) + internal-docs/Patch Report/Bug Report/
        # BUG-CORTEX-008-...-2026-07-13.md §8/§10.
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "high", "--reason", "post-migration", "--export", "--repo", "."]
        timeout_seconds: 300
        required: false

  post-rotation:
    description: Post-rotation Cortex re-index — fires after any protected doc has been archived and reset by a rotation script. Fail-soft; index must not run before archive succeeds. Covers domain-record-rotate.py (domain.record.md) and file-rotate.py (dev-notes.md, security-review.md). Caller contract [SEC-C1-001] — fire ONLY after a rotation script's --rotate exits 0. If --rotate fails, do NOT fire post-rotation (the live file is unchanged, so there is nothing to re-index).
    fail_soft: true
    steps:
      - name: cortex-high
        # BUG-CORTEX-008 (2026-07-13, Sukuna R1 stopgap): timeout raised 180->300s.
        # Embedding-DELTA-bound, not corpus-size-bound; see the cortex-rebuild-full
        # event below (R3 durable fix) + internal-docs/Patch Report/Bug Report/
        # BUG-CORTEX-008-...-2026-07-13.md §8/§10.
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "high", "--reason", "post-rotation", "--export", "--repo", "."]
        timeout_seconds: 300
        required: false

  cortex-compact:
    # WI-S3-9 (Stage 3 Phase 2, v9.7.0): Advisory compaction — sweep orphaned content
    # rows and VACUUM. Always fail-soft (advisory). Caller contract: fire ONLY when
    # compaction_recommended=True from brain status --json (or at periodic maintenance
    # intervals). NEVER fires automatically during ingest — operator-invoked or scheduled.
    # S3-RISK-003: compact aborts gracefully (exit 0) if index.lock is held.
    # SEC-UNIFIED-004: VACUUM OperationalError is caught and logged (fail-soft).
    description: Advisory Cortex compaction — sweep orphaned content rows and VACUUM to reclaim space (WI-S3-9, v9.7.0).
    fail_soft: true
    steps:
      - name: compact
        command: ["python", ".protocol-state/brain/brain.py", "compact", "--repo", "."]
        timeout_seconds: 120
        required: false

  cortex-rebuild-full:
    # BUG-CORTEX-008 R3 (2026-07-13, durable fix): the full --level high + --export
    # Cortex rebuild used to run synchronously at session-end, where it collided
    # with the session's own largest embedding delta and chronically timed out
    # (root cause: embedding-DELTA-bound cost, not corpus-size-bound — see
    # internal-docs/Patch Report/Bug Report/
    # BUG-CORTEX-008-sessionend-high-rebuild-timeout-2026-07-13.md §8/§10).
    # session-end now runs a fast incremental (--level medium, no --export) step
    # instead; this event carries the full rebuild+export off that critical path.
    #
    # INVOCATION (manual/periodic — DZP is no-daemon, there is no scheduler):
    #   python dzp.py event cortex-rebuild-full
    # Suggested cadence: weekly, or whenever `brain status` / the session-end
    # cortex-medium step reports notable drift, or before a Toji audit / release
    # where a fresh exported snapshot matters. Equivalent manual path (no
    # coordinator): `scripts/brain.ps1 index` (or `brain.sh index`) followed by
    # `scripts/brain.ps1 export --snapshot`.
    #
    # Fail-soft/advisory by design (required: false, no --strict) — this is a
    # maintenance convenience, not a gate; a timeout here only means the export
    # snapshot stays stale until the next run, exactly like the old session-end
    # behavior did when it hit its timeout.
    description: Manual/periodic full Cortex rebuild (--level high) + export snapshot, off the session-end critical path (BUG-CORTEX-008 R3). Invoke via 'python dzp.py event cortex-rebuild-full'.
    fail_soft: true
    steps:
      - name: cortex-high
        command: ["python", ".protocol-state/brain/cortex_trigger.py", "--level", "high", "--reason", "cortex-rebuild-full", "--export", "--repo", "."]
        timeout_seconds: 300
        required: false
