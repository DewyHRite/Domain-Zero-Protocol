# Domain Zero - Agent Skills Mapping (v4)
# Purpose: Map Claude Skills (Anthropic + custom) to each DZP agent
# Reference: https://github.com/anthropics/skills/tree/main/skills
# Updated for v8.10.0 - DZP ROE skill added to all agents

version: 5
updated: 2025-12-29
protocol_version: "9.11.0"

canonical_reference:
  overview: https://claude.com/blog/skills
  repository: https://github.com/anthropics/skills/tree/main/skills

# Available Anthropic Skills (16 total)
anthropic_skills_index:
  - pdf                    # PDF document creation
  - docx                   # Word document creation
  - xlsx                   # Excel spreadsheet creation
  - pptx                   # PowerPoint creation
  - frontend-design        # UI/UX design artifacts
  - web-artifacts-builder  # Interactive web components
  - webapp-testing         # Web application testing
  - mcp-builder            # MCP server creation
  - skill-creator          # New skill development
  - brand-guidelines       # Brand documentation
  - canvas-design          # Visual design canvas
  - doc-coauthoring        # Collaborative document editing
  - internal-comms         # Internal communication templates
  - theme-factory          # Theme/styling generation
  - algorithmic-art        # Generative art creation
  - slack-gif-creator      # Animated GIF creation

agents:
  gojo:
    role: "Mission Control"
    anthropic_skills:
      - skill-creator        # Create new protocol skills
      - pptx                 # Project summary presentations
      - internal-comms       # Protocol announcements
      - doc-coauthoring      # Collaborative documentation
    document_skills:
      - pptx
    custom_skills:
      - dzp-roe              # Post-compaction DZP rules reinforcement
      - skill-builder        # Create new skills rapidly
      - protocol-verify      # Protocol validation
      - release-briefing     # Release documentation
      - version-audit        # Version consistency check
      - work-session-monitoring
      - validate-protocol    # Protocol integrity verification
      - verify-installation  # Installation completeness check
      - dependency-scanner   # Security vulnerability scanning
      - file-rotate          # Rotate dev-notes/security-review
      - verify-auto-invoked  # CI/CD AUTO-INVOKED validation (v8.12.0)
      - validate-custom-agents  # Custom agent security validation
      # - verify-working-directory  # SEC-SKILLREG-001 (v9.11.0), CORRECTED per CodeRabbit
      #   PR #115 finding #25 (2026-08-03): the claim below that this script had "no script
      #   in the live tree" was FALSE and is retracted. scripts/verify_working_directory.py
      #   IS live in the tree today, is git-tracked, ships via publish-manifest.yaml
      #   include_scripts (line 53), and is actively imported by tier-statistics.py,
      #   gojo-learn.py, and sukuna-learn.py (grep-verified 2026-08-03). The implementation
      #   never disappeared. The ONLY missing artifact is a skill DOC/wrapper -- there has
      #   never been a verify-working-directory.md that would let it be invoked directly as
      #   `skill: "verify-working-directory"`; it exists only as an imported module. Left
      #   disabled here (not re-listed as an invocable skill) until that doc is written --
      #   not because anything needs restoring or deregistering. See
      #   protocol/skills/SKILL_REGISTRY.md for the full correction.
      - create-snapshot      # State snapshot creation
      - restore-snapshot     # State snapshot restoration
      - domain-record-rotate # Domain record archival
      # - memory-path-validator  # DEPRECATED v9.11.0 -- REMOVED from Gojo's active skills.
      #   The module (scripts/memory_path_validator.py) had ZERO callers, never executed, and is
      #   no longer shipped. Listing it here advertised a security capability that did not exist.
      #   See protocol/skills/SKILL_REGISTRY.md deprecation note. Do NOT re-enable without a
      #   live call site AND a test asserting the validator is actually reached.

